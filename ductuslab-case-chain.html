<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DuctusLab · Entegre Vaka Zinciri v2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"/>
<style>
:root{--bg0:#04070e;--bg1:#070c17;--bg2:#0b1220;--bg3:#101a2c;--glass:rgba(13,20,34,.7);--line:rgba(160,176,196,.12);--line2:rgba(160,176,196,.2);
--ink:#e4e9f1;--ink2:#a6b1c2;--ink3:#6c7889;--accent:#6fa3c8;--accent2:#4f7fa3;--accentd:rgba(111,163,200,.14);
--amber:#d9a441;--amberd:rgba(217,164,65,.14);--ok:#5a9f7f;--okd:rgba(90,159,127,.16);--alert:#c4565f;--alertd:rgba(196,86,95,.16);--violet:#9a86c9;
--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:radial-gradient(1200px 800px at 70% -10%,#0a1424,var(--bg0) 60%);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:9px 18px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);flex:0 0 auto;z-index:20}
.wordmark{font-weight:700;letter-spacing:.04em;font-size:15px}.wordmark em{color:var(--accent);font-style:normal}
.vsep{width:1px;height:22px;background:var(--line2)}.product{color:var(--ink2);font-size:12.5px}.spacer{flex:1}
.chip{font-size:11.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:999px;padding:4px 11px}.chip b{color:var(--accent)}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink2);font-family:var(--sans);font-size:12px;padding:6px 11px;cursor:pointer}
.seg button.on{color:#fff;background:var(--accentd)}.seg button+button{border-left:1px solid var(--line2)}
.btn{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:rgba(17,26,43,.55);border:1px solid var(--line2);border-radius:9px;padding:7px 12px;cursor:pointer;transition:.15s}
.btn:hover{color:var(--ink);border-color:var(--accent2);background:var(--accentd)}.btn.sm{padding:5px 9px;font-size:11.5px}
/* VİTAL BARI */
.vitals{display:flex;align-items:center;gap:0;flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--bg1);padding:7px 14px;overflow-x:auto}
.vitals .vt{display:flex;flex-direction:column;align-items:flex-start;padding:2px 16px;border-right:1px solid var(--line)}
.vitals .vt:last-child{border-right:0}
.vitals .vl{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.vitals .vv{font-family:var(--mono);font-size:16px;font-weight:600;line-height:1.1}
.vitals .vv.crit{color:#e88b92}.vitals .vv.warn{color:var(--amber)}.vitals .vv.ok{color:#8fe3bf}
.vitals .vphase{margin-left:auto;font-size:10.5px;color:var(--violet);white-space:nowrap}
.main{flex:1;display:flex;min-height:0}
.rail{flex:0 0 232px;border-right:1px solid var(--line);background:var(--bg1);overflow-y:auto;padding:12px 10px}
.rail h4{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:4px 6px 9px}
.station{display:flex;gap:9px;align-items:flex-start;padding:9px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;background:var(--bg2);transition:.15s}
.station:hover{border-color:var(--accent2)}.station.cur{border-color:var(--accent);background:var(--accentd)}
.station.done{opacity:.72}.station.done .ic{color:var(--ok)}
.station .ic{font-size:12px;font-weight:700;color:var(--ink3);min-width:42px;font-family:var(--mono)}
.station .nm{font-size:12.5px;font-weight:600}.station .st{font-size:10.5px;color:var(--ink3);margin-top:2px}
.phasebar{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);margin:11px 6px 6px;border-top:1px solid var(--line);padding-top:9px}
.content{flex:1;min-width:0;overflow-y:auto;padding:18px 20px}
.panel{max-width:720px}
.panelttl{font-size:18px;font-weight:700;margin-bottom:3px}
.panelsub{color:var(--ink2);font-size:12.5px;margin-bottom:13px;line-height:1.5}
.card{border:1px solid var(--line);border-radius:12px;background:var(--glass);padding:14px 15px;margin-bottom:13px}
.card h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:9px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:3px}
.actions button{font-family:var(--sans);font-size:12.5px;color:var(--ink);background:var(--bg3);border:1px solid var(--line2);border-radius:9px;padding:9px 12px;cursor:pointer;transition:.15s}
.actions button:hover{border-color:var(--accent2);background:var(--accentd)}
.actions button.pri{background:linear-gradient(135deg,#7ec0e8,#5a9bc4);color:#06131d;font-weight:600;border:0}
.actions button.done{opacity:.55}.actions button.trap{border-color:rgba(196,86,95,.3)}
.finding{margin-top:10px;border:1px solid rgba(90,159,127,.4);background:var(--okd);border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.finding b{color:#8fe3bf}
.drawer{margin-top:10px;border:1px solid var(--line2);border-radius:11px;overflow:hidden;display:none;background:#05080f}
.drawer.open{display:block}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--bg2);font-size:11.5px;color:var(--ink2)}
.drawer iframe{width:100%;height:440px;border:0;display:block;background:#05080f}
.flag{font-size:12px;padding:8px 11px;border-radius:9px;margin-top:8px;border:1px solid;line-height:1.45}
.flag.red{color:#e88b92;border-color:rgba(196,86,95,.45);background:var(--alertd)}
.flag.amber{color:var(--amber);border-color:rgba(217,164,65,.45);background:var(--amberd)}
.flag.green{color:#8fe3bf;border-color:rgba(90,159,127,.45);background:var(--okd)}
.hint{font-size:11.5px;color:var(--ink3);margin-top:7px;line-height:1.5}
/* SAĞ KANIT ÇİZELGESİ */
.evrail{flex:0 0 288px;border-left:1px solid var(--line);background:var(--bg1);overflow-y:auto;padding:14px 12px}
.evrail h4{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:2px 4px 10px;display:flex;justify-content:space-between}
.evitem{border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:9px;background:var(--bg2);padding:9px 10px;margin-bottom:8px}
.evitem.stale{border-left-color:var(--amber);opacity:.86}
.evitem .et{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--ink3)}
.evitem .es{font-size:12px;margin-top:4px;line-height:1.45}
.evitem .etag{font-size:9.5px;padding:2px 7px;border-radius:999px;border:1px solid}
.etag.fresh{color:#8fe3bf;border-color:rgba(90,159,127,.4);background:var(--okd)}
.etag.stale{color:var(--amber);border-color:rgba(217,164,65,.45);background:var(--amberd)}
.ho-q{margin:10px 0}.ho-q .q{font-size:13px;font-weight:600;margin-bottom:7px}
.ho-q label{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink2);padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer;line-height:1.4}
.ho-q label:hover{border-color:var(--accent2)}.ho-q label.sel{border-color:var(--accent);background:var(--accentd);color:var(--ink)}
.ho-q input{margin-top:2px;accent-color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(2,5,10,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60;padding:22px}
.overlay.open{display:flex}
.sheet{width:min(720px,94vw);max-height:90vh;overflow-y:auto;background:var(--bg1);border:1px solid var(--line2);border-radius:16px;padding:22px 24px}
.sheet h2{font-size:20px;margin-bottom:5px}.sheet .sub{color:var(--ink2);font-size:12.5px;margin-bottom:14px}
.jcat{margin:9px 0;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg2)}
.jcat .r{display:flex;justify-content:space-between;font-weight:600;font-size:13px}.bar{height:6px;border-radius:4px;background:#17202f;margin-top:7px;overflow:hidden}.bar>span{display:block;height:100%}
.selgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.selcard{border:1px solid var(--line);border-radius:13px;background:var(--bg2);padding:14px;cursor:pointer;transition:.15s}
.selcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.selcard .cx{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.06em}
.selcard .ct{font-size:15px;font-weight:700;margin:4px 0 4px}.selcard .cc{font-size:11.5px;color:var(--ink3);line-height:1.5}.selcard .cm{margin-top:8px;font-size:10px;color:var(--ink3)}
.toast{position:fixed;left:24px;bottom:22px;background:rgba(10,16,28,.96);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:9px;padding:11px 15px;font-size:12.5px;max-width:420px;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.bad{border-left-color:var(--alert)}.toast.warn{border-left-color:var(--amber)}.toast.good{border-left-color:var(--ok)}
@media(max-width:1100px){.evrail{flex-basis:220px}.rail{flex-basis:190px}}
@media(max-width:860px){.selgrid{grid-template-columns:1fr}.evrail{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="wordmark">Ductus<em>Lab</em></span><span class="vsep"></span>
    <span class="product" id="chainTitle">Entegre Nöbet &amp; Vaka Zinciri</span>
    <span class="spacer"></span>
    <span class="chip" id="varChip" style="display:none">Varyant <b id="varB">A</b></span>
    <span class="chip mono">⏱ <span id="simClock">00:00</span></span>
    <div class="seg" id="lvlSeg"><button class="on" data-lvl="student">TUS / Öğrenci</button><button data-lvl="resident">Asistan / Girişimsel</button></div>
    <button class="btn sm" id="switchBtn">⇄ Zincir Değiştir</button>
    <button class="btn sm" id="homeBtn">← Anasayfa</button>
  </div>
  <div class="vitals" id="vitalsBar" style="display:none"></div>
  <div class="main">
    <div class="rail" id="rail"></div>
    <div class="content"><div class="panel" id="panel"></div></div>
    <div class="evrail" id="evrail"></div>
  </div>
</div>
<div id="selOverlay" class="overlay open"><div class="sheet" id="selSheet"></div></div>
<div id="jury" class="overlay"><div class="sheet" id="jurySheet"></div></div>
<div id="toastHost"></div>

<script src="ductus-core.js"></script>
<script>
/* ===================================================================================
 *  DuctusLab · Case Chain v2.0 — 6 entegre hasta zinciri, 12 modül, ductus-core v1.1
 *  Canlı vital barı · zaman damgalı kanıt çizelgesi (GÜNCEL/TARİHSEL) · gömülü iframe
 *  çekmece + gerçek ?chain preset senkronu · meta-spoiler'sız klinik handoff.
 * =================================================================================== */
var $=function(id){return document.getElementById(id);};

var HREF={ ACİL:'acil/index.html', EKG:'ekg/index.html', EKO:'eko/index.html', VNT:'ventilator/index.html',
  KS:'ks/index.html', OTO:'oto/index.html', SFT:'sft/index.html', FND:'fnd/index.html', NRO:'nro/index.html',
  CathLab:'ductuslab-cathlab.html', 'NŞR':'ductuslab-neurosurgery.html', OSK:null, POCUS:'eko/index.html' };
var MODNAME={ ACİL:'Acil Konsol', EKG:'12-Derivasyon EKG', EKO:'Eko / POCUS', VNT:'Ventilatör', KS:'Kraniyal Sinir',
  OTO:'Otoskopi', SFT:'Spirometri', FND:'Fundoskopi', NRO:'Nörolojik Muayene', CathLab:'Kateter Lab', 'NŞR':'Nöroşirürji', OSK:'Oskültasyon', POCUS:'POCUS' };
var EXAMVERB={ ACİL:'🩸 Değerlendirme Sonucunu Gör', EKG:'⚡ 12-Der EKG Çek & Bulguyu Gör', EKO:'🫀 POCUS Bulgusunu İncele', VNT:'🌬 Ventilatör Yanıtını Gör',
  KS:'👁 Kraniyal Sinir Bulgusunu Gör', OTO:'👂 Otoskopi Bulgusunu Gör', SFT:'🫁 Spirometri Sonucunu Gör', FND:'🔎 Fundoskopi Bulgusunu İncele',
  NRO:'🚶 Nörolojik Muayene Bulgusunu Gör', CathLab:'🩺 Anjiyo/PCI Sonucunu Gör', 'NŞR':'🧠 Operasyon Sonucunu Gör', OSK:'🎧 Oskültasyon Bulgusunu Gör', POCUS:'🫀 POCUS Bulgusunu İncele' };

function s(mod,dom,title,prompt,ev,decisions,opts){ return Object.assign({mod:mod,dom:dom,title:title,prompt:prompt,ev:ev||null,decisions:decisions||[]},opts||{}); }
function d(id,label,kind,lock,critical,vfx){ return {id:id,label:label,kind:kind||'neutral',lock:lock||null,critical:!!critical,vfx:vfx||null}; }
function MAP(v){ return Math.round(v.dbp+(v.sbp-v.dbp)/3); }

/* =============================== 6 ZİNCİR =============================== */
var CHAINS={
 1:{ id:1, nick:'Akut Göğüs Ağrısı & Primer PCI', path:'ACİL → EKG → CathLab → EKO/POCUS',
   complaint:'58Y erkek, ~1 saattir baskı tarzında göğüs ağrısı, soğuk terleme, bulantı.',
   dxTitle:'İnferiyor STEMI + Sağ Ventrikül Tutulumu (RCA)', dxWords:['STEMI','RCA','infarkt'], truthDom:'coronary',
   vitals:{hr:52,sbp:98,dbp:60,spo2:95,rr:18,gcs:15},
   stations:[
     s('ACİL','hemodynamic','Triyaj & İlk Stabilizasyon','Monitörize et, damar yolu, ilk ilaç kararları. Vitallere bakarak karar ver.',
        {sum:'İnferiyor iskemi kliniği; bradikardi + hipotansiyona eğilim, akciğerler temiz, boyun venleri dolgun (RV yükü lehine)',claims:['triage']},
        [ d('aspirin','Aspirin 300 mg çiğnet','safe'), d('heparin','Antikoagülan (heparin)','safe'),
          d('nitrat','Dilaltı nitrat ver','trap','RV tutulumlu inferiyor STEMI’de nitrat ön-yükü düşürüp ani hipotansiyon/şok yapar — KONTRENDİKE. Önce IV sıvı ile ön-yükü koru.',true,{sbp:-42,dbp:-24,hr:12,spo2:-3}),
          d('fluid','IV sıvı bolus (ön-yük)','safe',null,false,{sbp:10,dbp:6}) ]),
     s('EKG','coronary','12-Derivasyon EKG','ST elevasyonu paternini ve sorumlu arteri belirle; gerekirse sağ prekordiyal derivasyon.',
        {sum:'DII-DIII-aVF ST elevasyonu + V4R’de ST↑ → inferiyor duvar + sağ ventrikül; sorumlu arter RCA',claims:['stemi_territory','culprit']},
        [ d('v4r','Sağ prekordiyal (V4R) ekle','safe'), d('culprit','Sorumlu arter: RCA onayla','safe') ]),
     s('CathLab','coronary','Primer PCI (Reperfüzyon)','Kapı-balon süresini koru; stent sonrası eski EKG/anjiyo TARİHSEL olur.',
        {sum:'RCA proksimalde total oklüzyon; primer PCI + stent, sonrası TIMI 3 akım',claims:['reperfusion']},
        [ d('pci','RCA primer PCI + stent','safe',null,false,{sbp:14,dbp:8,hr:8,spo2:2}) ], {phaseBreak:'coronary', phaseLabel:'Reperfüzyon sonrası — stent öncesi kanıtlar TARİHSEL'}),
     s('EKO','hemodynamic','Eko / POCUS','Reperfüzyon sonrası sağ ventrikül fonksiyonu, efüzyon ve mekanik komplikasyon.',
        {sum:'POCUS: RV dilate/hipokinetik; mekanik komplikasyon/perikardiyal efüzyon açısından yatak başı izlem',claims:['rv_function','effusion']},
        [ d('pocus','POCUS kaydet','safe'), d('timing','Reperfüzyonu geciktirmeden, stabilizasyon sonrası eko','safe') ]) ],
   handoff:{ status:[
       'Primer PCI sonrası TIMI 3 sağlandı; hemodinami IV sıvı ile stabilize, iskemik ağrı geriledi — koroner yoğun bakımda izlem',
       'Primer PCI sonrası TIMI 3 sağlandı ancak yeni hipotansiyon ve sınırda nabız basıncı; mekanik komplikasyon/perikardiyal efüzyon açısından yatak başı POCUS izleminde',
       'Reperfüzyon sağlanamadı / no-reflow; inotrop ve mekanik destek ihtiyacı açısından değerlendiriliyor'],
     unc:['RV yükü ve sağ kalp yetmezliği derinliği net değil; sıvı yanıtı titre ediliyor',
          'Reperfüzyon aritmisi (hızlanmış idiyoventriküler ritim) riski izlemde',
          'Mekanik komplikasyon (akut MR, VSR, serbest duvar rüptürü) henüz dışlanmadı'],
     alarm:['Tekrar göğüs ağrısı + ST yeniden yükselmesi (stent tromboz/re-oklüzyon)',
            'Yeni pansistolik üfürüm + ani hipotansiyon (mekanik komplikasyon)',
            'Geniş kompleksli taşikardi / nabızsız ritim (malign aritmi)'] } },

 2:{ id:2, nick:'Gök Gürültüsü Baş Ağrısı & Pitozis', path:'ACİL → KS → FND → EKG → NŞR',
   complaint:'48Y kadın, ani başlayan “hayatımın en kötü” baş ağrısı; sağ göz kapağında düşme ve çift görme.',
   dxTitle:'Anevrizmal Subaraknoid Kanama + Kompresif CN III (IC-PC anevrizma)', dxWords:['SAK','subaraknoid','anevrizma'], truthDom:'neuro',
   vitals:{hr:62,sbp:182,dbp:98,spo2:97,rr:16,gcs:14},
   stations:[
     s('ACİL','hemodynamic','Triyaj & Görüntüleme Kararı','Ani maksimal baş ağrısı + fokal bulgu. İlk adım?',
        {sum:'Ani maksimal (gök gürültüsü) baş ağrısı, ense sertliği, hipertansif; kontrastsız BT planlandı',claims:['triage']},
        [ d('ct','Kontrastsız kraniyal BT iste','safe'), d('bp','Analjezi + kontrollü KB yönetimi','safe',null,false,{sbp:-18,dbp:-10}),
          d('lp_direct','Doğrudan LP yap','trap','Papilödem/kitle dışlanmadan doğrudan LP → serebral herniasyon riski. Önce görüntüleme.',true,{gcs:-2}) ]),
     s('KS','neuro','Kraniyal Sinir Muayenesi','Göz kapağını kaldır, pupil ve bakış yönünü değerlendir.',
        {sum:'Sağ pitozis, dilate ışığa yanıtsız pupil, göz aşağı-dışa deviye → kompresif üçüncü sinir (cerrahi acil)',claims:['cn3_compressive']},
        [ d('lid','Kapağı kaldır / pupil-bakış değerlendir','safe') ]),
     s('FND','neuro','Fundoskopi','Göz dibinde preretinal kanama ve disk değerlendirmesi.',
        {sum:'Preretinal/subhyaloid (Terson) kanama; disk sınırları değerlendirildi',claims:['terson']},
        [ d('view','Göz dibini incele','safe'),
          d('tropicamide','Tropikamid damlat','trap','Pupil kompresif sinir izleminin anahtarıdır; farmakolojik dilatasyon pupil takibini bozar — KONTRENDİKE.',true),
          d('lp_here','Papilödem öncesi doğrudan LP','trap','Görüntülemeyle kitle/kanama dışlanmadan LP → herniasyon.',false,{gcs:-1}) ]),
     s('EKG','rhythm','12-Derivasyon EKG','Bu klinik bağlamda EKG değişikliklerini yorumla.',
        {sum:'Derin, yaygın serebral T negatifliği + uzun QT — nörojenik (koroner iskemi değil)',claims:['neurogenic_ecg']},
        [ d('read','Nörojenik değişiklik olarak yorumla','safe'),
          d('stemi_cath','STEMI sanıp heparin yükle + CathLab’a yolla','trap','Nörojenik EKG’yi STEMI sanıp antikoagülasyon + kateter → aktif kanamada ölümcül. KONTRENDİKE.',true,{gcs:-3,sbp:20}) ]),
     s('NŞR','neuro','Nöroşirürji — Definitif Tedavi','Nimodipin + KB kontrolü sonrası definitif tedavi.',
        {sum:'IC-PC anevrizma mikrocerrahi klipaj; post-op kraniyal sinir izlemi',claims:['aneurysm_secured']},
        [ d('clip','Anevrizma klipajı','safe',null,false,{sbp:-10}), d('nimodipine','Nimodipin + KB kontrolü','safe',null,false,{sbp:-12,dbp:-8}) ],
        {phaseBreak:'neuro', phaseLabel:'Definitif tedavi sonrası — operasyon öncesi nörolojik kanıtlar TARİHSEL'}) ],
   handoff:{ status:[
       'Anevrizma mikrocerrahi klipaj ile güvenli; nimodipin altında, gecikmiş vazospazm açısından nörolojik izlemde',
       'Anevrizma henüz güvenli değil; KB kontrolü ve yeniden kanama önlemi altında definitif tedavi bekliyor',
       'Nörolojik tabloda kötüleşme; yeniden kanama/akut hidrosefali açısından acil görüntüleme ve girişim planlanıyor'],

function boot(chainId,variant,level){ CC.chainId=chainId; CC.chain=CHAINS[chainId]; CC.variant=variant||'A'; CC.level=level||CC.level;
  CC.idx=0; CC.done={}; CC.flags=[]; CC.handoff={}; CC.capturedEv={}; CC.booted=true; CC.vitals=Object.assign({},CC.chain.vitals); openSession();

  $('varChip').style.display=''; $('varB').textContent=CC.variant; $('vitalsBar').style.display='flex';

  h+='</div>';
  h+='<div id="finding-'+i+'"></div>';
  if(url) h+='<div class="drawer" id="drawer-'+i+'"><div class="dh"><span>↳ '+MODNAME[st.mod]+' — bu hastanın vakası (?chain=1) ile gömülü</span><button class="btn sm" onclick="toggleDrawer('+i+')">Kapat</button></div><div id="iframewrap-'+i+'"></div></div>';
  h+='</div>';
  if(st.decisions&&st.decisions.length){ h+='<div class="card"><h3>Klinik Karar</h3><div class="actions" id="dec-'+i+'">';
    st.decisions.forEach(function(dec){ h+='<button class="'+(dec.kind==='trap'?'trap ':'')+'" id="d-'+i+'-'+dec.id+'" onclick="decide('+i+',\''+dec.id+'\')">'+dec.label+'</button>'; });
    h+='</div><div id="decflags-'+i+'"></div></div>'; }
  h+='<div class="actions"><button class="pri" onclick="nextStation('+i+')">Bu istasyonu tamamla →</button></div>';
  p.innerHTML=h; renderFinding(i); renderDecFlags(i);
}
function renderFinding(i){ var box=$('finding-'+i); if(!box)return; var st=CC.chain.stations[i];
  if(CC.done['ev'+i]&&st.ev){ var ev=CC.capturedEv[i], stale=ev?isStaleEv(ev).stale:false;
    box.innerHTML='<div class="finding"><b>Bulgu kaydedildi'+(stale?' (TARİHSEL)':'')+':</b> '+st.ev.sum+'</div>'; }
  else if(st.ev) box.innerHTML='<div class="hint">Bu istasyonun bulgusu henüz incelenmedi — kanıt kaydetmeden devam etmeyin.</div>';
}
function renderDecFlags(i){ var box=$('decflags-'+i); if(!box)return; var mine=CC.flags.filter(function(f){return f.station===i;});
  box.innerHTML=mine.map(function(f){ return '<div class="flag '+(f.kind==='trap'?'red':f.kind==='safe'?'green':'amber')+'">'+f.msg+'</div>'; }).join(''); }

window.examCapture=function(i){ var st=CC.chain.stations[i]; if(!st.ev)return;
  if(!CC.done['ev'+i]){ var rec=CC.S.addEvidence({ modality:st.mod, summary:st.ev.sum, claims:st.ev.claims }); CC.capturedEv[i]=rec; CC.done['ev'+i]=true;
    var b=$('cap-'+i); if(b){ b.classList.add('done'); b.textContent='✓ Bulgu kaydedildi'; } toast('Kanıt kaydedildi: '+MODNAME[st.mod],'good'); }
  renderFinding(i); renderEvRail(); };
window.toggleDrawer=function(i){ var dr=$('drawer-'+i); if(!dr)return; var open=dr.classList.toggle('open');
  var wrap=$('iframewrap-'+i); if(open&&wrap&&!wrap.firstChild){ var st=CC.chain.stations[i]; var f=document.createElement('iframe'); f.src=moduleURL(st,i); f.loading='lazy'; wrap.appendChild(f); toast(MODNAME[st.mod]+' bu hastanın vakasıyla gömülü açıldı.','good'); } };
window.openNewTab=function(i){ var st=CC.chain.stations[i]; var url=moduleURL(st,i); if(url){ window.open(url,'_blank','noopener'); toast(MODNAME[st.mod]+' yeni sekmede açıldı.','good'); } };

window.decide=function(i,decId){ var st=CC.chain.stations[i], dec=st.decisions.find(function(x){return x.id===decId;}); if(!dec)return; var b=$('d-'+i+'-'+decId);
  if(dec.vfx) applyVitals(dec.vfx);
  if(dec.kind==='trap'){ logFlag(i,'trap','🔒 GÜVENLİK KİLİDİ — '+dec.label+': '+dec.lock, dec.critical, decId); if(b){ b.style.borderColor='rgba(196,86,95,.6)'; b.style.color='#e88b92'; } toast('🔒 Kontrendikasyon engellendi: '+dec.label,'bad'); }
  else if(dec.kind==='safe'){ logFlag(i,'safe','✓ Uygun karar: '+dec.label, false, decId); if(b)b.classList.add('done'); }
  else { logFlag(i,'neutral',dec.label+' uygulandı.', false, decId); }
  renderDecFlags(i); };
function logFlag(station,kind,msg,critical,decId){ CC.flags.push({station:station,kind:kind,msg:msg,critical:!!critical,decId:decId}); }

window.nextStation=function(i){ var st=CC.chain.stations[i];
  if(st.ev&&!CC.done['ev'+i]){ toast('⚠ Bu istasyonda kanıt kaydetmediniz — Hasta Devri eksik kanıtla zayıflar. Önce bulguyu inceleyin.','warn'); }
  if(st.phaseBreak){ var dom=st.phaseBreak, cur=CC.S.getRevisions()[dom]; var patch={}; patch[dom]=cur+1; CC.S.update({revisions:patch}); renderEvRail();
    toast('⏲ '+(st.phaseLabel||('Revizyon: '+dom)),'warn'); }
  CC.done[i]=true; renderRail();
  var nxt=i+1; if(nxt<CC.chain.stations.length) renderStation(nxt);
  else if(allStationsDone()) renderHandoff(); else { var fu=CC.chain.stations.findIndex(function(_,k){return !CC.done[k];}); renderStation(fu<0?i:fu); } };

/* -------- SAĞ KANIT ZAMAN ÇİZELGESİ -------- */
function fmtMs(ms){ var sec=Math.floor(ms/1000); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }
function domTR(a){ return {coronary:'koroner',rhythm:'ritim',hemodynamic:'hemodinamik',respiratory:'solunum',neuro:'nörolojik'}[a]||a; }
function renderEvRail(){ var r=$('evrail'); if(!CC.S){ r.innerHTML=''; return; } var evs=CC.S.getEvidence();
  var h='<h4><span>📑 Toplanan Kanıt</span><span>'+evs.length+'</span></h4>';
  if(!evs.length){ h+='<div class="hint">Henüz kanıt yok. Her istasyonda bulguyu inceleyip kaydedin.</div>'; }
  evs.forEach(function(e){ var stObj=isStaleEv(e), stale=stObj.stale; var areas=(stObj.staleAreas||[]).map(domTR).join(', ');
    h+='<div class="evitem'+(stale?' stale':'')+'"><div class="et"><span>'+(MODNAME[e.modality]||e.modality)+' · '+fmtMs(e.acquiredAtSimMs)+'</span><span class="etag '+(stale?'stale':'fresh')+'">'+(stale?'TARİHSEL'+(areas?' ('+areas+')':''):'GÜNCEL')+'</span></div><div class="es">'+e.summary+'</div></div>'; });
  r.innerHTML=h;
}

/* -------- HANDOFF -------- */
function renderHandoff(){ CC.idx='handoff'; renderRail(); renderVitalsBar(); var ch=CC.chain, p=$('panel'); var evs=CC.S.getEvidence();
  var h='<div class="panelttl">📋 Yapılandırılmış Hasta Devri (Handoff)</div>'+
    '<div class="panelsub">Serbest metin değil — her yanıtı topladığınız <b>güncel</b> kanıta bağlayın. TARİHSEL kanıt seçerseniz işaretlenir.</div>';
  h+='<div class="card"><div class="ho-q"><div class="q">1) Güncel Durum</div>'+ch.handoff.status.map(function(o,k){ return '<label onclick="hoPick(\'status\','+k+',this)"><input type="radio" name="status"><span>'+o+'</span></label>'; }).join('')+'</div></div>';
  h+='<div class="card"><div class="ho-q"><div class="q">2) Devri Destekleyen Güncel Kanıt</div>'+
     (evs.length?evs.map(function(e){ var stale=isStaleEv(e).stale; return '<label onclick="hoPick(\'evidence\',\''+e.id+'\',this)"><input type="radio" name="evidence"><span>'+MODNAME[e.modality]+' — '+e.summary+' <span class="etag '+(stale?'stale':'fresh')+'">'+(stale?'TARİHSEL':'GÜNCEL')+'</span></span></label>'; }).join('')
      :'<div class="hint">Hiç kanıt kaydedilmemiş — geri dönüp istasyon bulgularını inceleyin.</div>')+'</div></div>';
  h+='<div class="card"><div class="ho-q"><div class="q">3) Kalan Belirsizlik</div>'+ch.handoff.unc.map(function(o,k){ return '<label onclick="hoPick(\'unc\','+k+',this)"><input type="radio" name="unc"><span>'+o+'</span></label>'; }).join('')+'</div></div>';
  h+='<div class="card"><div class="ho-q"><div class="q">4) Kötüleşme / Alarm Kriteri</div>'+ch.handoff.alarm.map(function(o,k){ return '<label onclick="hoPick(\'alarm\','+k+',this)"><input type="radio" name="alarm"><span>'+o+'</span></label>'; }).join('')+'</div></div>';
  h+='<div class="actions"><button class="pri" onclick="submitHandoff()">Devri Tamamla &amp; Zincir Jürisi →</button></div>';
  p.innerHTML=h;
}
window.hoPick=function(key,val,el){ CC.handoff[key]=val; var grp=el.parentNode.querySelectorAll('label'); [].forEach.call(grp,function(l){l.classList.remove('sel');}); el.classList.add('sel');
  if(key==='evidence'){ var ev=CC.S.getEvidence().find(function(e){return e.id===val;}); CC.handoff.evidenceStale=ev?isStaleEv(ev).stale:false; } };
window.submitHandoff=function(){ if(CC.handoff.status==null||CC.handoff.evidence==null||CC.handoff.unc==null||CC.handoff.alarm==null){ toast('Dört devir sorusunu da yanıtlayın.','warn'); return; }
  if(CC.handoff.evidenceStale) logFlag('handoff','trap','🔒 STALE_EVIDENCE_USED — Devri TARİHSEL (süresi geçmiş) kanıta dayandırdınız; faz/müdahale sonrası o alan revize oldu.',true,'stale');
  buildJury(); };

/* -------- JÜRİ -------- */
function buildJury(){ var ch=CC.chain, flags=CC.flags; var clampN=function(x){return Math.max(0,Math.min(100,Math.round(x)));};
  var trapHit=flags.filter(function(f){return f.kind==='trap';}), critHit=trapHit.filter(function(f){return f.critical;}), safeHit=flags.filter(function(f){return f.kind==='safe';});
  var evs=CC.S.getEvidence();
  var c1=55+Math.min(evs.length,CC.chain.stations.length)*11; if(CC.handoff.evidenceStale)c1-=40; c1=clampN(c1);
  var c2=100; critHit.forEach(function(){c2-=45;}); trapHit.filter(function(f){return !f.critical;}).forEach(function(){c2-=15;}); c2=clampN(c2);
  var c3=40+safeHit.length*12; if(critHit.length)c3-=20; c3=clampN(c3);
  var c4=52; ['status','evidence','unc','alarm'].forEach(function(k){ if(CC.handoff[k]!=null)c4+=11; }); if(CC.handoff.evidenceStale)c4-=25; c4=clampN(c4);
  var overall=Math.round(c1*0.25+c2*0.3+c3*0.25+c4*0.2); var col=function(v){return v>=75?'#8fe3bf':v>=55?'#d9a441':'#e88b92';};
  function cat(name,v,notes){ return '<div class="jcat"><div class="r"><span>'+name+'</span><span class="mono" style="color:'+col(v)+'">'+v+'</span></div><div class="bar"><span style="width:'+v+'%;background:'+col(v)+'"></span></div>'+notes.map(function(n){return '<div class="hint">'+n+'</div>';}).join('')+'</div>'; }
  var fl=''; trapHit.forEach(function(f){ fl+='<div class="flag '+(f.critical?'red':'amber')+'">'+f.msg+'</div>'; }); if(!trapHit.length) fl+='<div class="flag green">Kritik kontrendikasyon tuzağına düşülmedi.</div>';
  $('jurySheet').innerHTML='<h2>Zincir #'+ch.id+' Jürisi</h2>'+
    '<div class="sub">'+ch.nick+' — '+(CC.level==='resident'?'Asistan/Girişimsel':'TUS/Öğrenci')+' · Varyant '+CC.variant+'. Gerçek tanı: <b>'+ch.dxTitle+'</b></div>'+
    '<div class="jcat" style="border-color:rgba(111,163,200,.3)"><div class="r"><span>Genel Zincir Skoru</span><span class="mono" style="font-size:20px;color:'+col(overall)+'">'+overall+'</span></div></div>'+
    cat('Kanıt Bütünlüğü (güncellik/modalite)',c1,['Kaydedilen kanıt: '+evs.length+'/'+ch.stations.length, CC.handoff.evidenceStale?'⚠ Devir TARİHSEL kanıta dayandırıldı':'Devir güncel kanıta dayandı'])+
    cat('Tuzak & Güvenlik',c2,[ critHit.length?('⚠ '+critHit.length+' kritik kontrendikasyon'):'Kritik kontrendikasyondan kaçınıldı', 'Toplam tuzak: '+trapHit.length ])+
    cat('Klinik Karar & Sıralama',c3,['Uygun karar: '+safeHit.length])+
    cat('Hasta Devri (Handoff)',c4,['4 soru: '+['status','evidence','unc','alarm'].filter(function(k){return CC.handoff[k]!=null;}).length+'/4 yanıtlandı'])+
    '<div style="margin-top:12px">'+fl+'</div>'+
    '<div class="actions" style="margin-top:14px"><button class="pri" onclick="document.getElementById(\'jury\').classList.remove(\'open\')">Kapat</button><button onclick="showSelector()">⇄ Başka Zincir</button></div>';
  $('jury').classList.add('open');
}

/* -------- SEÇİCİ -------- */
function showSelector(){ var h='<h2>🩺 6 Entegre Nöbet & Vaka Zinciri</h2><div class="sub">12 modül tam entegre — ductus-core v1.1 ile truth sızmazlığı, alan-bazlı revizyon ve kanıt güncelliği. Mod ve varyant seçin, bir zincir açın. Tanı öncesi spoiler yok.</div>';
  h+='<div class="actions" style="margin-bottom:6px"><div class="seg" id="selLvl"><button class="'+(CC.level==='student'?'on':'')+'" data-lvl="student">TUS / Öğrenci</button><button class="'+(CC.level==='resident'?'on':'')+'" data-lvl="resident">Asistan / Girişimsel</button></div>'+
    '<div class="seg" id="selVar"><button class="'+(CC.variant==='A'?'on':'')+'" data-v="A">Varyant A</button><button class="'+(CC.variant==='B'?'on':'')+'" data-v="B">Varyant B</button></div></div><div class="selgrid">';
  Object.keys(CHAINS).forEach(function(k){ var c=CHAINS[k]; h+='<div class="selcard" onclick="pickChain('+k+')"><div class="cx">ZİNCİR #'+k+'</div><div class="ct">'+c.nick+'</div><div class="cc">'+c.complaint+'</div><div class="cm">'+c.path+'</div></div>'; });
  h+='</div>'; $('selSheet').innerHTML=h; $('selOverlay').classList.add('open'); $('jury').classList.remove('open');
  [].forEach.call($('selLvl').children,function(b){ b.onclick=function(){ CC.level=b.dataset.lvl; [].forEach.call($('selLvl').children,function(x){x.classList.toggle('on',x===b);}); }; });
  [].forEach.call($('selVar').children,function(b){ b.onclick=function(){ CC.variant=b.dataset.v; [].forEach.call($('selVar').children,function(x){x.classList.toggle('on',x===b);}); }; });
}
window.pickChain=function(k){ boot(k,CC.variant,CC.level); }; window.showSelector=showSelector;
function toast(msg,kind){ var host=$('toastHost'); var t=document.createElement('div'); t.className='toast'+(kind?' '+kind:''); t.textContent=msg; host.innerHTML=''; host.appendChild(t); setTimeout(function(){ t.style.opacity='0'; t.style.transition='.4s'; setTimeout(function(){ if(t.parentNode)t.remove(); },420); },3400); }
$('switchBtn').onclick=showSelector; $('homeBtn').onclick=function(){ location.href='index.html'; };
[].forEach.call($('lvlSeg').children,function(b){ b.onclick=function(){ CC.level=b.dataset.lvl; [].forEach.call($('lvlSeg').children,function(x){x.classList.toggle('on',x===b);}); }; });
var simClockT=Date.now(); function tick(){ var s=Math.floor((Date.now()-simClockT)/1000); $('simClock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); requestAnimationFrame(tick); }

/* -------- ZİNCİR → MODÜL VAKA EŞLEMESİ (?case=) -------- */
CHAINS[2].stations[1].caseN=3;  // KS: Kompresif CN III (dizi 0-indeks)
CHAINS[2].stations[2].caseN=8;  // FND: Terson (SAK) (obje 1-indeks)
CHAINS[3].stations[1].caseN=2;  // SFT: KOAH
CHAINS[4].stations[1].caseN=5;  // FND: Malign HT retinopati
CHAINS[4].stations[2].caseN=2;  // NRO: fokal defisit karşılaştırması (hemiplejik)
CHAINS[6].stations[0].caseN=7;  // OTO: Marjinal/Atik Pars Flaccida kolesteatom (dizi 0-indeks)
CHAINS[6].stations[1].caseN=4;  // NRO: Serebellar ataksi
CHAINS[6].stations[2].caseN=3;  // FND: Papilödem

/* =============================== TEST API =============================== */
window.CC2={
  chains:function(){ return Object.keys(CHAINS).map(Number); },
  boot:function(id,variant,level){ boot(id,variant||'A',level||'student'); return true; },
  spoilerCheck:function(id){ var c=CHAINS[id]; var vis=[c.complaint,c.nick].concat(c.stations.map(function(st){return st.title;})).join(' ').toLowerCase();
    var leak=c.dxWords.filter(function(w){ return vis.indexOf(w.toLowerCase())>=0; }); return {clean:leak.length===0, leaked:leak}; },
  fireCriticalTrap:function(id){ boot(id,'A','student'); var c=CHAINS[id]; var found=null;
    c.stations.forEach(function(st,i){ st.decisions.forEach(function(dec){ if(dec.kind==='trap'&&dec.critical&&!found){ renderStation(i); decide(i,dec.id); found={station:i}; } }); });
    var f=CC.flags.find(function(x){return x.kind==='trap'&&x.critical;}); return {fired:!!found, locked:!!f, msg:f?f.msg:null}; },
  phaseStaleCheck:function(id){ boot(id,'A','student'); var c=CHAINS[id]; var pb=c.stations.findIndex(function(st){return st.phaseBreak;}); if(pb<0)return{hasPhase:false};
    var dom=c.stations[pb].phaseBreak; var ei=-1; for(var i=0;i<pb;i++){ if(c.stations[i].ev){ei=i;break;} } if(ei<0)ei=pb; examCapture(ei); var ev=CC.capturedEv[ei];
    var r0=CC.S.getRevisions()[dom], sb=isStaleEv(ev).stale; nextStation(pb); var r1=CC.S.getRevisions()[dom], sa=isStaleEv(ev).stale;
    return {hasPhase:true,dom:dom,rev0:r0,rev1:r1,bumped:r1>r0,staleBefore:sb,staleAfter:sa}; },
  handoffStaleFlag:function(id){ var r=this.phaseStaleCheck(id); if(!r.hasPhase)return{na:true}; CC.chain.stations.forEach(function(_,i){CC.done[i]=true;});
    var se=CC.S.getEvidence().find(function(e){return isStaleEv(e).stale;}); CC.handoff={status:0,unc:0,alarm:0}; CC.handoff.evidence=se?se.id:null; CC.handoff.evidenceStale=!!se;
    submitHandoff(); var f=CC.flags.find(function(x){return x.decId==='stale';}); return {picked:!!se,flagged:!!f}; },
  // vital barı + kanıt çizelgesi görünür + olayla güncelleniyor
  vitalsRailCheck:function(id){ boot(id,'A','student'); var vb=$('vitalsBar'); var txt=vb.textContent;
    var visible=(vb.style.display!=='none')&&/HR/.test(txt)&&/KB/.test(txt)&&/SpO/.test(txt);
    var before=Object.assign({},CC.vitals);
    // ilk vfx'li kararı bul ve uygula → vital değişmeli
    var changed=false; var c=CHAINS[id]; outer: for(var i=0;i<c.stations.length;i++){ var st=c.stations[i]; for(var j=0;j<st.decisions.length;j++){ var dc=st.decisions[j]; if(dc.vfx){ renderStation(i); decide(i,dc.id); changed=(CC.vitals.sbp!==before.sbp||CC.vitals.spo2!==before.spo2||CC.vitals.hr!==before.hr||CC.vitals.gcs!==before.gcs||CC.vitals.dbp!==before.dbp); break outer; } } }
    var railExists=$('evrail')!=null; examCapture(0); var railHasItem=$('evrail').querySelectorAll('.evitem').length>0;
    return {vitalsVisible:visible, vitalsUpdate:changed, railVisible:railExists, railHasEvidence:railHasItem}; },
  moduleURL:function(id,idx){ boot(id,'A','student'); return moduleURL(CHAINS[id].stations[idx],idx); },
  caseFor:function(id,idx){ return CHAINS[id].stations[idx].caseN||null; },
  handoffOptions:function(id){ var h=CHAINS[id].handoff; return [].concat(h.status,h.unc,h.alarm); },
  state:function(){ return {chainId:CC.chainId, idx:CC.idx, flags:CC.flags.length, vitals:CC.vitals, revisions:CC.S?CC.S.getRevisions():null}; }
};
showSelector(); tick(); window.CHAIN_READY=true;
</script>
