<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DuctusLab · Entegre Vaka Zinciri v2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"/>
<style>
:root{--bg0:#04070e;--bg1:#070c17;--bg2:#0b1220;--bg3:#101a2c;--glass:rgba(13,20,34,.7);--line:rgba(160,176,196,.12);--line2:rgba(160,176,196,.2);
--ink:#e4e9f1;--ink2:#a6b1c2;--ink3:#6c7889;--accent:#6fa3c8;--accent2:#4f7fa3;--accentd:rgba(111,163,200,.14);
--amber:#d9a441;--amberd:rgba(217,164,65,.14);--ok:#5a9f7f;--okd:rgba(90,159,127,.16);--alert:#c4565f;--alertd:rgba(196,86,95,.16);--violet:#9a86c9;
--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:radial-gradient(1200px 800px at 70% -10%,#0a1424,var(--bg0) 60%);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);flex:0 0 auto;z-index:20}
.wordmark{font-weight:700;letter-spacing:.04em;font-size:15px}.wordmark em{color:var(--accent);font-style:normal}
.vsep{width:1px;height:22px;background:var(--line2)}.product{color:var(--ink2);font-size:12.5px}.spacer{flex:1}
.chip{font-size:11.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:999px;padding:4px 11px}
.chip b{color:var(--accent)}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink2);font-family:var(--sans);font-size:12px;padding:6px 11px;cursor:pointer}
.seg button.on{color:#fff;background:var(--accentd)}.seg button+button{border-left:1px solid var(--line2)}
.btn{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:rgba(17,26,43,.55);border:1px solid var(--line2);border-radius:9px;padding:7px 12px;cursor:pointer;transition:.15s}
.btn:hover{color:var(--ink);border-color:var(--accent2);background:var(--accentd)}.btn.sm{padding:5px 9px;font-size:11.5px}
.main{flex:1;display:flex;min-height:0}
.rail{flex:0 0 268px;border-right:1px solid var(--line);background:var(--bg1);overflow-y:auto;padding:14px 12px}
.rail h4{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:4px 6px 10px}
.station{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer;background:var(--bg2);transition:.15s}
.station:hover{border-color:var(--accent2)}.station.cur{border-color:var(--accent);background:var(--accentd)}
.station.done{opacity:.72}.station.done .ic{color:var(--ok)}
.station .ic{font-size:13px;font-weight:700;color:var(--ink3);min-width:46px;font-family:var(--mono)}
.station .nm{font-size:13px;font-weight:600}.station .st{font-size:11px;color:var(--ink3);margin-top:2px}
.phasebar{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);margin:12px 6px 7px;border-top:1px solid var(--line);padding-top:10px}
.content{flex:1;min-width:0;overflow-y:auto;padding:20px 24px}
.panel{max-width:760px}
.panelttl{font-size:19px;font-weight:700;margin-bottom:3px}
.panelsub{color:var(--ink2);font-size:13px;margin-bottom:14px;line-height:1.5}
.card{border:1px solid var(--line);border-radius:13px;background:var(--glass);padding:15px 16px;margin-bottom:14px}
.card h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.actions button{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--bg3);border:1px solid var(--line2);border-radius:9px;padding:9px 13px;cursor:pointer;transition:.15s}
.actions button:hover{border-color:var(--accent2);background:var(--accentd)}
.actions button.pri{background:linear-gradient(135deg,#7ec0e8,#5a9bc4);color:#06131d;font-weight:600;border:0}
.actions button.done{opacity:.55;pointer-events:none}
.actions button.trap{border-color:rgba(196,86,95,.3)}
.evrow{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:var(--bg2)}
.tag{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid}
.tag.fresh{color:#8fe3bf;border-color:rgba(90,159,127,.4);background:var(--okd)}
.tag.stale{color:var(--amber);border-color:rgba(217,164,65,.45);background:var(--amberd)}
.flag{font-size:12px;padding:8px 11px;border-radius:9px;margin-top:8px;border:1px solid;line-height:1.45}
.flag.red{color:#e88b92;border-color:rgba(196,86,95,.45);background:var(--alertd)}
.flag.amber{color:var(--amber);border-color:rgba(217,164,65,.45);background:var(--amberd)}
.flag.green{color:#8fe3bf;border-color:rgba(90,159,127,.45);background:var(--okd)}
.hint{font-size:11.5px;color:var(--ink3);margin-top:7px;line-height:1.5}
.ho-q{margin:12px 0}.ho-q .q{font-size:13px;font-weight:600;margin-bottom:7px}
.ho-q label{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink2);padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer}
.ho-q label:hover{border-color:var(--accent2)}.ho-q label.sel{border-color:var(--accent);background:var(--accentd);color:var(--ink)}
.ho-q input{margin-top:2px;accent-color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(2,5,10,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60;padding:22px}
.overlay.open{display:flex}
.sheet{width:min(720px,94vw);max-height:90vh;overflow-y:auto;background:var(--bg1);border:1px solid var(--line2);border-radius:16px;padding:22px 24px}
.sheet h2{font-size:20px;margin-bottom:5px}.sheet .sub{color:var(--ink2);font-size:12.5px;margin-bottom:14px}
.jcat{margin:9px 0;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg2)}
.jcat .r{display:flex;justify-content:space-between;font-weight:600;font-size:13px}.bar{height:6px;border-radius:4px;background:#17202f;margin-top:7px;overflow:hidden}.bar>span{display:block;height:100%}
.selgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.selcard{border:1px solid var(--line);border-radius:13px;background:var(--bg2);padding:14px;cursor:pointer;transition:.15s}
.selcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.selcard .cx{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.06em}
.selcard .ct{font-size:15px;font-weight:700;margin:4px 0 4px}
.selcard .cc{font-size:11.5px;color:var(--ink3);line-height:1.5}
.selcard .cm{margin-top:8px;font-size:10px;color:var(--ink3)}
.toast{position:fixed;left:24px;bottom:22px;background:rgba(10,16,28,.96);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:9px;padding:11px 15px;font-size:12.5px;max-width:420px;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.bad{border-left-color:var(--alert)}.toast.warn{border-left-color:var(--amber)}.toast.good{border-left-color:var(--ok)}
@media(max-width:900px){.rail{flex-basis:200px}.selgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="wordmark">Ductus<em>Lab</em></span><span class="vsep"></span>

</div>

/* =============================== DURUM / MOTOR =============================== */
var CC={ chainId:null, chain:null, variant:'A', level:'student', idx:0, done:{}, flags:[], handoff:{}, S:null, booted:false };

function openSession(){ CC.S=DuctusCore.open({ patientId:'chain'+CC.chainId+'-'+CC.variant+'-'+Date.now(), forceSeed:true,
    seed:{ demographics:{}, revisions:{coronary:0,rhythm:0,hemodynamic:0,respiratory:0,neuro:0}, truth:{dx:CC.chain.dxTitle} } }); }

function boot(chainId,variant,level){ CC.chainId=chainId; CC.chain=CHAINS[chainId]; CC.variant=variant||'A'; CC.level=level||CC.level;
  CC.idx=0; CC.done={}; CC.flags=[]; CC.handoff={}; CC.booted=true; openSession();
  $('selOverlay').classList.remove('open'); $('jury').classList.remove('open');
  $('chainTitle').textContent='Zincir #'+chainId+' · '+CC.chain.nick+'  ·  '+CC.chain.path;
  $('varChip').style.display=''; $('varB').textContent=CC.variant;
  [].forEach.call($('lvlSeg').children,function(b){ b.classList.toggle('on',b.dataset.lvl===CC.level); });
  renderRail(); renderStation(0); toast('Zincir #'+chainId+' başladı — tanı öncesi yalnız başvuru yakınması gösterilir.','good');
}
function stationDom(i){ return CC.chain.stations[i].dom; }
function isStaleEv(ev){ try{ return CC.S.isStale(ev).stale; }catch(e){ return false; } }

function renderRail(){ var r=$('rail'), h='<h4>İstasyon Zinciri</h4>'; var lastPhase=null;
  CC.chain.stations.forEach(function(st,i){ if(st.phase&&st.phase!==lastPhase){ h+='<div class="phasebar">Faz '+st.phase+'</div>'; lastPhase=st.phase; }
    var cls='station'+(i===CC.idx?' cur':'')+(CC.done[i]?' done':'');
    h+='<div class="'+cls+'" data-i="'+i+'"><div class="ic">'+st.mod+'</div><div><div class="nm">'+st.title+'</div><div class="st">'+(CC.done[i]?'tamamlandı':MODNAME[st.mod]||st.mod)+'</div></div></div>'; });
  h+='<div class="phasebar">Kapanış</div><div class="station" data-i="handoff"><div class="ic">📋</div><div><div class="nm">Hasta Devri</div><div class="st">4 yapılandırılmış soru + jüri</div></div></div>';
  r.innerHTML=h;
  [].forEach.call(r.querySelectorAll('.station'),function(el){ el.onclick=function(){ var i=el.dataset.i; if(i==='handoff'){ if(allStationsDone()) renderHandoff(); else toast('Önce istasyonları tamamlayın.','warn'); } else renderStation(+i); }; });
}
function allStationsDone(){ return CC.chain.stations.every(function(_,i){ return CC.done[i]; }); }

function renderStation(i){ CC.idx=i; renderRail(); var st=CC.chain.stations[i], p=$('panel');
  var href=HREF[st.mod];
  var h='<div class="panelttl">'+st.title+'</div>'+
    '<div class="panelsub"><b>Başvuru:</b> '+CC.chain.complaint+'<br>'+st.prompt+'</div>';
  // modül aç + inceleme
  h+='<div class="card"><h3>'+(MODNAME[st.mod]||st.mod)+' İstasyonu</h3>';
  h+='<div class="actions">';
  if(href) h+='<button class="pri" onclick="openModule(\''+st.mod+'\','+i+')">↗ '+MODNAME[st.mod]+' simülatörünü aç (yeni sekme)</button>';
  if(st.ev) h+='<button id="cap-'+i+'" onclick="captureEv('+i+')">🔎 İncele &amp; Kanıt Kaydet</button>';
  h+='</div>';
  if(!href) h+='<div class="hint">Bu modalite yatak-başı inceleme olarak bu kart içinde değerlendirilir.</div>';
  h+='<div id="evbox-'+i+'"></div></div>';
  // klinik karar
  if(st.decisions&&st.decisions.length){ h+='<div class="card"><h3>Klinik Karar</h3><div class="actions" id="dec-'+i+'">';
    st.decisions.forEach(function(dec){ h+='<button class="'+(dec.kind==='trap'?'trap ':'')+'" id="d-'+i+'-'+dec.id+'" onclick="decide('+i+',\''+dec.id+'\')">'+dec.label+'</button>'; });
    h+='</div><div id="decflags-'+i+'"></div></div>'; }
  // ilerleme
  h+='<div class="actions"><button class="pri" onclick="nextStation('+i+')">Bu istasyonu tamamla →</button></div>';
  p.innerHTML=h; renderEvBox(i); renderDecFlags(i);
}
function renderEvBox(i){ var box=$('evbox-'+i); if(!box)return; var st=CC.chain.stations[i]; if(!st.ev)return;
  if(CC.done['ev'+i]){ var evObj=CC.capturedEv&&CC.capturedEv[i]; var stale=evObj?isStaleEv(evObj):false;
    box.innerHTML='<div class="evrow"><span>'+st.ev.sum+'</span><span class="tag '+(stale?'stale':'fresh')+'">'+(stale?'TARİHSEL':'GÜNCEL')+'</span></div>'; }
  else box.innerHTML='<div class="hint">Kanıt henüz kaydedilmedi.</div>';
}
function renderDecFlags(i){ var box=$('decflags-'+i); if(!box)return; var mine=CC.flags.filter(function(f){return f.station===i;});
  box.innerHTML=mine.map(function(f){ return '<div class="flag '+(f.kind==='trap'?'red':f.kind==='safe'?'green':'amber')+'">'+f.msg+'</div>'; }).join(''); }

window.openModule=function(mod,i){ var href=HREF[mod]; if(!href){ toast('Bu modalite inline değerlendirilir.','warn'); return; }
  var url=href+(href.indexOf('?')<0?'?':'&')+'chain=1&chainId='+CC.chainId+'&pid='+encodeURIComponent(CC.S.getState().patientId);
  window.open(url,'_blank','noopener'); toast(MODNAME[mod]+' yeni sekmede açıldı — gerçek kanıt üretip buraya dönün.','good'); };

window.captureEv=function(i){ var st=CC.chain.stations[i]; if(!st.ev||CC.done['ev'+i])return;
  CC.capturedEv=CC.capturedEv||{}; var rec=CC.S.addEvidence({ modality:st.mod, summary:st.ev.sum, claims:st.ev.claims, dependsOn:{} });
  CC.capturedEv[i]=rec; CC.done['ev'+i]=true; var b=$('cap-'+i); if(b){b.classList.add('done');b.textContent='✓ Kanıt kaydedildi';}
  renderEvBox(i); toast('Kanıt kaydedildi: '+MODNAME[st.mod],'good'); };

window.decide=function(i,decId){ var st=CC.chain.stations[i], dec=st.decisions.find(function(x){return x.id===decId;}); if(!dec)return;
  var b=$('d-'+i+'-'+decId);
  if(dec.kind==='trap'){ logFlag(i,'trap','🔒 GÜVENLİK KİLİDİ — '+dec.label+': '+dec.lock, dec.critical, decId);
    if(b){ b.style.borderColor='rgba(196,86,95,.6)'; b.style.color='#e88b92'; } toast('🔒 Kontrendikasyon engellendi: '+dec.label,'bad'); }
  else if(dec.kind==='safe'){ logFlag(i,'safe','✓ Uygun karar: '+dec.label, false, decId); if(b)b.classList.add('done'); }
  else { logFlag(i,'neutral',dec.label+' uygulandı.', false, decId); }
  renderDecFlags(i);
};
function logFlag(station,kind,msg,critical,decId){ CC.flags.push({station:station,kind:kind,msg:msg,critical:!!critical,decId:decId,mod:CC.chain.stations[station]?CC.chain.stations[station].mod:null}); }

window.nextStation=function(i){ var st=CC.chain.stations[i];
  // faz/müdahale kırılımı → ilgili alan revizyonu artar, önceki kanıt TARİHSEL olur
  if(st.phaseBreak){ var dom=st.phaseBreak, cur=CC.S.getRevisions()[dom]; var patch={}; patch[dom]=cur+1; CC.S.update({revisions:patch});
    toast('⏲ '+(st.phaseLabel||('Revizyon: '+dom))+'','warn'); }
  CC.done[i]=true; renderRail();
  var nxt=i+1; if(nxt<CC.chain.stations.length) renderStation(nxt);
  else if(allStationsDone()) renderHandoff(); else { var firstUndone=CC.chain.stations.findIndex(function(_,k){return !CC.done[k];}); renderStation(firstUndone<0?i:firstUndone); }
};

/* =============================== HANDOFF =============================== */
function renderHandoff(){ CC.idx='handoff'; renderRail(); var ch=CC.chain, p=$('panel');
  var evs=CC.S.getEvidence();
  var h='<div class="panelttl">📋 Yapılandırılmış Hasta Devri (Handoff)</div>'+
    '<div class="panelsub">Serbest metin değil — her yanıtı topladığınız <b>güncel</b> kanıta bağlayın. TARİHSEL kanıt seçerseniz işaretlenir.</div>';
  // Q1 Güncel Durum
  h+='<div class="card"><div class="ho-q"><div class="q">1) Güncel Durum</div>'+ch.handoff.status.map(function(o,k){
     return '<label onclick="hoPick(\'status\','+k+',this)"><input type="radio" name="status"><span>'+o+'</span></label>'; }).join('')+'</div></div>';
  // Q2 Destekleyen Güncel Kanıt (stale işaretli)
  h+='<div class="card"><div class="ho-q"><div class="q">2) Devri Destekleyen Güncel Kanıt</div>'+
     (evs.length?evs.map(function(e){ var stale=CC.S.isStale(e).stale;
       return '<label onclick="hoPick(\'evidence\',\''+e.id+'\',this)"><input type="radio" name="evidence"><span>'+MODNAME[e.modality]+' — '+e.summary+' <span class="tag '+(stale?'stale':'fresh')+'">'+(stale?'TARİHSEL':'GÜNCEL')+'</span></span></label>'; }).join('')
      :'<div class="hint">Kanıt kaydedilmemiş.</div>')+'</div></div>';
  // Q3 Kalan Belirsizlik
  var unc=['Henüz netleşmeyen ayırıcı tanı var','Tedavi yanıtı izlemde','Komplikasyon riski sürüyor'];
  h+='<div class="card"><div class="ho-q"><div class="q">3) Kalan Belirsizlik</div>'+unc.map(function(o,k){
     return '<label onclick="hoPick(\'unc\','+k+',this)"><input type="radio" name="unc"><span>'+o+'</span></label>'; }).join('')+'</div></div>';
  // Q4 Kötüleşme Alarm Kriteri
  h+='<div class="card"><div class="ho-q"><div class="q">4) Kötüleşme / Alarm Kriteri</div>'+ch.handoff.alarm.map(function(o,k){
     return '<label onclick="hoPick(\'alarm\','+k+',this)"><input type="radio" name="alarm"><span>'+o+'</span></label>'; }).join('')+'</div></div>';
  h+='<div class="actions"><button class="pri" onclick="submitHandoff()">Devri Tamamla &amp; Zincir Jürisi →</button></div>';
  p.innerHTML=h;
}
window.hoPick=function(key,val,el){ CC.handoff[key]=val; var grp=el.parentNode.querySelectorAll('label'); [].forEach.call(grp,function(l){l.classList.remove('sel');}); el.classList.add('sel');
  if(key==='evidence'){ var ev=CC.S.getEvidence().find(function(e){return e.id===val;}); CC.handoff.evidenceStale=ev?CC.S.isStale(ev).stale:false; } };

window.submitHandoff=function(){ if(CC.handoff.status==null||CC.handoff.evidence==null||CC.handoff.unc==null||CC.handoff.alarm==null){ toast('Dört devir sorusunu da yanıtlayın.','warn'); return; }
  if(CC.handoff.evidenceStale) logFlag('handoff','trap','🔒 STALE_EVIDENCE_USED — Devri TARİHSEL (süresi geçmiş) kanıta dayandırdınız; faz/müdahale sonrası o alan revize oldu.',true,'stale');
  buildJury(); };

/* =============================== JÜRİ =============================== */
function buildJury(){ var ch=CC.chain, flags=CC.flags; var clampN=function(x){return Math.max(0,Math.min(100,Math.round(x)));};
  var trapHit=flags.filter(function(f){return f.kind==='trap';});
  var critHit=trapHit.filter(function(f){return f.critical;});
  var safeHit=flags.filter(function(f){return f.kind==='safe';});
  var evs=CC.S.getEvidence();
  // 1 Kanıt Bütünlüğü
  var c1=60+Math.min(evs.length,CC.chain.stations.length)*10; if(CC.handoff.evidenceStale)c1-=40; c1=clampN(c1);
  // 2 Tuzak / Güvenlik
  var c2=100; critHit.forEach(function(){c2-=45;}); trapHit.filter(function(f){return !f.critical;}).forEach(function(){c2-=15;}); c2=clampN(c2);
  // 3 Klinik Karar & Sıralama
  var c3=40+safeHit.length*12; if(critHit.length)c3-=20; c3=clampN(c3);
  // 4 Hasta Devri
  var c4=55; if(CC.handoff.status!=null)c4+=12; if(CC.handoff.alarm!=null)c4+=12; if(CC.handoff.unc!=null)c4+=11; if(CC.handoff.evidence!=null&&!CC.handoff.evidenceStale)c4+=10; if(CC.handoff.evidenceStale)c4-=25; c4=clampN(c4);
  var overall=Math.round(c1*0.25+c2*0.3+c3*0.25+c4*0.2);
  var col=function(v){return v>=75?'#8fe3bf':v>=55?'#d9a441':'#e88b92';};
  function cat(name,v,notes){ return '<div class="jcat"><div class="r"><span>'+name+'</span><span class="mono" style="color:'+col(v)+'">'+v+'</span></div><div class="bar"><span style="width:'+v+'%;background:'+col(v)+'"></span></div>'+
    notes.map(function(n){return '<div class="hint">'+n+'</div>';}).join('')+'</div>'; }
  var fl=''; flags.filter(function(f){return f.kind==='trap';}).forEach(function(f){ fl+='<div class="flag '+(f.critical?'red':'amber')+'">'+f.msg+'</div>'; });
  if(!trapHit.length) fl+='<div class="flag green">Kritik kontrendikasyon tuzağına düşülmedi.</div>';
  $('jurySheet').innerHTML='<h2>Zincir #'+ch.id+' Jürisi</h2>'+
    '<div class="sub">'+ch.nick+' — '+(CC.level==='resident'?'Asistan/Girişimsel':'TUS/Öğrenci')+' · Varyant '+CC.variant+'. Gerçek tanı: <b>'+ch.dxTitle+'</b></div>'+
    '<div class="jcat" style="border-color:rgba(111,163,200,.3)"><div class="r"><span>Genel Zincir Skoru</span><span class="mono" style="font-size:20px;color:'+col(overall)+'">'+overall+'</span></div></div>'+
    cat('Kanıt Bütünlüğü (güncellik/modalite)',c1,['Kaydedilen kanıt: '+evs.length+'/'+ch.stations.length, CC.handoff.evidenceStale?'⚠ Devir TARİHSEL kanıta dayandırıldı':'Devir güncel kanıta dayandı'])+
    cat('Tuzak & Güvenlik',c2,[ critHit.length?('⚠ '+critHit.length+' kritik kontrendikasyon'):'Kritik kontrendikasyondan kaçınıldı', 'Toplam tuzak: '+trapHit.length ])+
    cat('Klinik Karar & Sıralama',c3,['Uygun karar: '+safeHit.length])+
    cat('Hasta Devri (Handoff)',c4,['4 soru: '+['status','evidence','unc','alarm'].filter(function(k){return CC.handoff[k]!=null;}).length+'/4 yanıtlandı'])+
    '<div style="margin-top:12px">'+fl+'</div>'+
    '<div class="actions" style="margin-top:14px"><button class="pri" onclick="document.getElementById(\'jury\').classList.remove(\'open\')">Kapat</button><button onclick="showSelector()">⇄ Başka Zincir</button></div>';
  $('jury').classList.add('open');
}

    '<div class="seg" id="selVar"><button class="'+(CC.variant==='A'?'on':'')+'" data-v="A">Varyant A</button><button class="'+(CC.variant==='B'?'on':'')+'" data-v="B">Varyant B</button></div></div>';
  h+='<div class="selgrid">';
  Object.keys(CHAINS).forEach(function(k){ var c=CHAINS[k];
    h+='<div class="selcard" onclick="pickChain('+k+')"><div class="cx">ZİNCİR #'+k+'</div><div class="ct">'+c.nick+'</div><div class="cc">'+c.complaint+'</div><div class="cm">'+c.path+'</div></div>'; });
  h+='</div>';
  $('selSheet').innerHTML=h; $('selOverlay').classList.add('open'); $('jury').classList.remove('open');
  [].forEach.call($('selLvl').children,function(b){ b.onclick=function(){ CC.level=b.dataset.lvl; [].forEach.call($('selLvl').children,function(x){x.classList.toggle('on',x===b);}); }; });
  [].forEach.call($('selVar').children,function(b){ b.onclick=function(){ CC.variant=b.dataset.v; [].forEach.call($('selVar').children,function(x){x.classList.toggle('on',x===b);}); }; });
}
window.pickChain=function(k){ boot(k,CC.variant,CC.level); };
window.showSelector=showSelector;

function toast(msg,kind){ var host=$('toastHost'); var t=document.createElement('div'); t.className='toast'+(kind?' '+kind:''); t.textContent=msg; host.innerHTML=''; host.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; t.style.transition='.4s'; setTimeout(function(){ if(t.parentNode)t.remove(); },420); },3400); }

$('switchBtn').onclick=showSelector;
$('homeBtn').onclick=function(){ location.href='index.html'; };
[].forEach.call($('lvlSeg').children,function(b){ b.onclick=function(){ CC.level=b.dataset.lvl; [].forEach.call($('lvlSeg').children,function(x){x.classList.toggle('on',x===b);}); toast(CC.level==='resident'?'Asistan/Girişimsel mod':'TUS/Öğrenci mod'); }; });

var simClockT=Date.now();
function tick(){ var ms=Date.now()-simClockT; var s=Math.floor(ms/1000); $('simClock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); requestAnimationFrame(tick); }

/* =============================== TEST API =============================== */
window.CC2={
  chains:function(){ return Object.keys(CHAINS).map(Number); },
  boot:function(id,variant,level){ boot(id,variant||'A',level||'student'); return true; },
  // tanı öncesi spoiler denetimi: gösterilen başvuru + istasyon başlıkları dx kelimesi içermemeli
  // tanı öncesi, her zaman görünen metin: başvuru yakınması + seçici nick + istasyon BAŞLIKLARI (muayene prompt'ları ve tıklama-sonrası geri bildirim öğretimdir, denetim dışı)
  spoilerCheck:function(id){ var c=CHAINS[id]; var vis=[c.complaint, c.nick].concat(c.stations.map(function(st){return st.title;})).join(' ').toLowerCase();
    var leak=c.dxWords.filter(function(w){ return vis.indexOf(w.toLowerCase())>=0; }); return {clean:leak.length===0, leaked:leak}; },
  // kritik tuzağı tetikle → güvenlik kilidi bayrağı dönmeli
  fireCriticalTrap:function(id){ boot(id,'A','student'); var c=CHAINS[id]; var found=null;
    c.stations.forEach(function(st,i){ st.decisions.forEach(function(dec){ if(dec.kind==='trap'&&dec.critical&&!found){ renderStation(i); decide(i,dec.id); found={station:i,decId:dec.id}; } }); });
    var trapFlag=CC.flags.find(function(f){return f.kind==='trap'&&f.critical;});
    return { fired:!!found, locked:!!trapFlag, msg:trapFlag?trapFlag.msg:null }; },
  // faz/müdahale → revizyon artışı + eski kanıt TARİHSEL
  phaseStaleCheck:function(id){ boot(id,'A','student'); var c=CHAINS[id];
    var pbIdx=c.stations.findIndex(function(st){return st.phaseBreak;}); if(pbIdx<0) return {hasPhase:false};
    var dom=c.stations[pbIdx].phaseBreak;
    // phaseBreak'ten ÖNCEki ilk kanıtı yakala
    var earlyIdx=-1; for(var i=0;i<pbIdx;i++){ if(c.stations[i].ev){ earlyIdx=i; break; } }
    if(earlyIdx<0) earlyIdx=pbIdx; captureEv(earlyIdx); var earlyEv=CC.capturedEv[earlyIdx];
    var rev0=CC.S.getRevisions()[dom]; var staleBefore=CC.S.isStale(earlyEv).stale;
    nextStation(pbIdx); // faz kırılımı
    var rev1=CC.S.getRevisions()[dom]; var staleAfter=CC.S.isStale(earlyEv).stale;
    return { hasPhase:true, dom:dom, rev0:rev0, rev1:rev1, bumped:rev1>rev0, staleBefore:staleBefore, staleAfter:staleAfter }; },
  // handoff'ta TARİHSEL kanıt seçilince STALE_EVIDENCE_USED
  handoffStaleFlag:function(id){ var r=this.phaseStaleCheck(id); if(!r.hasPhase) return {na:true};
    // tüm istasyonları tamamla
    CC.chain.stations.forEach(function(_,i){ CC.done[i]=true; });
    var staleEv=CC.S.getEvidence().find(function(e){return CC.S.isStale(e).stale;});
    CC.handoff={status:0,unc:0,alarm:0}; CC.handoff.evidence=staleEv?staleEv.id:null; CC.handoff.evidenceStale=staleEv?true:false;
    submitHandoff(); var f=CC.flags.find(function(x){return x.decId==='stale';});
    return { picked:!!staleEv, flagged:!!f, msg:f?f.msg:null }; },
  state:function(){ return {chainId:CC.chainId, idx:CC.idx, flags:CC.flags.length, revisions:CC.S?CC.S.getRevisions():null}; }
};

showSelector(); tick();
window.CHAIN_READY=true;
</script>
