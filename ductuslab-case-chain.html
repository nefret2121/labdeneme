<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DuctusLab · Entegre Vaka Zinciri #1</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
  :root { --bg-0:#05070c; --bg-1:#0a0f1a; --bg-2:#0e1524; --line:rgba(150,170,200,.12); --line-2:rgba(150,170,200,.24);
    --ink:#e6ecf5; --ink-2:#9fb0c6; --ink-3:#64728a; --accent:#5fa8d8; --amber:#e0a94a; --ok:#59b88a; --alert:#d85f6a; --violet:#9a86c9;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; } html,body { height:100%; }
  body { background:var(--bg-0); color:var(--ink); font-family:var(--sans); font-size:13px; -webkit-font-smoothing:antialiased; }
  .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  #app { display:grid; grid-template-rows:auto auto 1fr; min-height:100vh; }
  button { font-family:var(--sans); font-size:12px; font-weight:600; color:var(--ink-2); background:rgba(20,30,48,.7); border:1px solid var(--line-2); border-radius:8px; padding:8px 13px; cursor:pointer; transition:all .14s; }
  button:hover:not(:disabled) { color:var(--ink); border-color:var(--accent); } button:disabled { opacity:.45; cursor:not-allowed; }
  button.pri { background:var(--ok); color:#04101f; border-color:var(--ok); font-weight:700; } button.pri:hover { filter:brightness(1.1); }
  button.warnb { background:rgba(224,169,74,.18); border-color:rgba(224,169,74,.5); color:#f3d79a; }
  button.on { background:rgba(95,168,216,.2); color:var(--ink); border-color:var(--accent); }
  /* header */
  header { display:flex; align-items:center; gap:14px; padding:12px 18px; background:var(--bg-1); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .brand { font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; } .brand em { font-style:normal; color:var(--accent); }
  .brand small { display:block; font-size:10px; letter-spacing:.08em; color:var(--ink-3); font-weight:500; text-transform:none; }
  header .sp { flex:1; }
  .lvl { display:flex; gap:4px; } .lvl button { font-size:11px; padding:6px 11px; }
  a.home { color:var(--ink-3); text-decoration:none; font-size:12px; font-weight:600; } a.home:hover { color:var(--ink); }
  /* patient file bar */
  .pfile { display:flex; align-items:center; gap:18px; padding:9px 18px; background:var(--bg-2); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .pfile .who { font-size:13px; font-weight:700; } .pfile .who small { color:var(--ink-3); font-weight:500; }
  .vit { display:flex; gap:14px; } .vit div { text-align:center; } .vit .l { font-size:9px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.05em; } .vit .v { font-family:var(--mono); font-size:15px; font-weight:600; } .vit .v.bad { color:var(--alert); }
  .clock { margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--ink-3); }
  /* layout */
  main { display:grid; grid-template-columns:200px 1fr 300px; min-height:0; }
  /* station rail */
  #rail { background:var(--bg-1); border-right:1px solid var(--line); padding:12px 10px; display:flex; flex-direction:column; gap:7px; }
  #rail .hd { font-size:9.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin:4px 4px 2px; }
  .station { display:flex; align-items:center; gap:9px; padding:10px 11px; border:1px solid var(--line-2); border-radius:10px; background:rgba(20,30,48,.5); cursor:pointer; transition:all .12s; }
  .station:hover { border-color:var(--accent); } .station.on { background:rgba(95,168,216,.2); border-color:var(--accent); color:var(--ink); }
  .station.done { border-color:rgba(89,184,138,.45); } .station .ic { font-size:16px; } .station .nm { font-size:12px; font-weight:600; } .station .st { font-size:9px; color:var(--ink-3); }
  .station.locked { opacity:.5; cursor:not-allowed; }
  /* stage */
  #stage { padding:18px 22px; overflow-y:auto; min-height:0; }
  .panelttl { font-size:16px; font-weight:700; margin-bottom:3px; } .panelsub { font-size:12px; color:var(--ink-3); margin-bottom:14px; }
  .card { background:var(--bg-1); border:1px solid var(--line); border-radius:12px; padding:15px 16px; margin-bottom:12px; }
  .card h3 { font-size:13px; font-weight:600; margin-bottom:8px; } .card p { font-size:12.5px; color:var(--ink-2); line-height:1.6; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .opts { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .opts label { display:flex; align-items:center; gap:9px; font-size:12px; color:var(--ink-2); background:rgba(10,16,28,.6); border:1px solid var(--line); border-radius:8px; padding:8px 11px; cursor:pointer; }
  .opts label:hover { border-color:var(--accent); } .opts label.sel { border-color:var(--accent); background:rgba(95,168,216,.12); color:var(--ink); }
  .opts input { accent-color:var(--accent); }
  canvas.ecg { width:100%; background:#05080e; border:1px solid var(--line); border-radius:8px; display:block; }
  .flag { font-size:11.5px; padding:8px 11px; border-radius:8px; margin-top:8px; line-height:1.5; }
  .flag.warn { background:rgba(224,169,74,.14); color:#f3d79a; border:1px solid rgba(224,169,74,.4); }
  .flag.ok { background:rgba(89,184,138,.14); color:#8fe3bf; border:1px solid rgba(89,184,138,.4); }
  .flag.bad { background:rgba(216,95,106,.14); color:#f1b0b7; border:1px solid rgba(216,95,106,.5); }
  .pocus { background:#070d16; border:1px solid var(--line); border-radius:10px; height:180px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  /* evidence rail */
  #ev { background:var(--bg-1); border-left:1px solid var(--line); padding:12px 12px; overflow-y:auto; min-height:0; }
  #ev .hd { font-size:9.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-bottom:8px; }
  .evc { border:1px solid var(--line-2); border-radius:9px; padding:8px 10px; margin-bottom:7px; background:rgba(20,30,48,.4); }
  .evc .top { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .evc .md { font-size:11.5px; font-weight:600; } .evc .tm { font-family:var(--mono); font-size:9.5px; color:var(--ink-3); }
  .evc .sm { font-size:10.5px; color:var(--ink-2); margin-top:3px; line-height:1.4; }
  .tag { font-family:var(--mono); font-size:9px; font-weight:600; padding:1px 6px; border-radius:5px; }
  .tag.cur { background:rgba(89,184,138,.18); color:#8fe3bf; } .tag.hist { background:rgba(224,169,74,.18); color:#f3d79a; } .tag.na { background:rgba(108,120,137,.2); color:var(--ink-3); }
  /* overlay (jury) */
  .overlay { position:fixed; inset:0; z-index:80; background:rgba(2,4,8,.76); backdrop-filter:blur(5px); display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:34px 16px; }
  .overlay.open { display:flex; }
  .sheet { width:760px; max-width:100%; background:linear-gradient(180deg,#0a1120,#070b14); border:1px solid var(--line-2); border-radius:16px; padding:20px 22px; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .sheet h2 { font-size:17px; font-weight:700; margin-bottom:4px; } .sheet .sub { font-size:11.5px; color:var(--ink-3); margin-bottom:14px; }
  .scoreHead { display:flex; align-items:center; justify-content:space-between; gap:14px; background:rgba(20,30,48,.5); border:1px solid var(--line-2); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .bigscore { font-family:var(--mono); font-size:34px; font-weight:700; } .bigscore small { font-size:14px; color:var(--ink-3); }
  .verdict { font-size:13px; font-weight:700; padding:8px 12px; border-radius:10px; text-align:center; max-width:320px; }
  .verdict.ok { background:rgba(89,184,138,.14); color:#8fe3bf; border:1px solid rgba(89,184,138,.5); }
  .verdict.warn { background:rgba(224,169,74,.14); color:#f3d79a; border:1px solid rgba(224,169,74,.5); }
  .verdict.crit { background:rgba(216,95,106,.16); color:#f1b0b7; border:1px solid rgba(216,95,106,.6); }
  .jcat { background:rgba(10,16,28,.5); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .jcat li { font-size:11.5px; color:var(--ink-2); list-style:none; display:flex; gap:7px; margin:3px 0; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:rgba(10,16,28,.96); border:1px solid var(--line-2); border-radius:10px; padding:10px 17px; font-size:12.5px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:90; max-width:72vw; text-align:center; }
  #toast.show { opacity:1; }
  @media (max-width:1000px){ main { grid-template-columns:1fr; } #rail { flex-direction:row; overflow-x:auto; } #ev { display:none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="home" href="index.html">← Anasayfa</a>
    <div class="brand">Ductus<em>Lab</em> · Vaka Zinciri<small id="chainSub">#1 — Akut Göğüs Ağrısı → Reperfüzyon → Devir</small></div>
    <div class="sp"></div>
    <div class="lvl" id="lvlSel">
      <button data-lvl="student" class="on">🎓 TUS / Öğrenci</button>
      <button data-lvl="resident">🩺 Asistan / Girişimsel</button>
    </div>
    <button onclick="restartCase()">↺ Vakayı Yenile</button>
  </header>

  <div class="pfile">
    <div class="who" id="pWho">—</div>
    <div class="vit">
      <div><div class="l">HR</div><div class="v" id="vHr">—</div></div>
      <div><div class="l">KB</div><div class="v" id="vBp">—</div></div>
      <div><div class="l">MAP</div><div class="v" id="vMap">—</div></div>
      <div><div class="l">SpO₂</div><div class="v" id="vSpo2">—</div></div>
      <div><div class="l">RR</div><div class="v" id="vRr">—</div></div>
    </div>
    <div class="clock">⏱ <span id="simClock">00:00</span> · zincir süresi</div>
  </div>

  <main>
    <nav id="rail">
      <div class="hd">İstasyonlar</div>
      <div class="station on" data-stn="triage"><span class="ic">🚑</span><div><div class="nm">Acil Değerlendirme</div><div class="st" id="s-triage">triyaj</div></div></div>
      <div class="station" data-stn="ecg"><span class="ic">💓</span><div><div class="nm">12-Der EKG</div><div class="st" id="s-ecg">bekliyor</div></div></div>
      <div class="station" data-stn="echo"><span class="ic">🫀</span><div><div class="nm">Eko / POCUS</div><div class="st" id="s-echo">opsiyonel</div></div></div>
      <div class="station" data-stn="cath"><span class="ic">🩻</span><div><div class="nm">CathLab</div><div class="st" id="s-cath">reperfüzyon</div></div></div>
      <div class="station" data-stn="handoff"><span class="ic">📋</span><div><div class="nm">Hasta Devri</div><div class="st" id="s-handoff">bitiş</div></div></div>
    </nav>
    <section id="stage"></section>
    <aside id="ev">
      <div class="hd">Toplanan Kanıt (zaman damgalı)</div>
      <div id="evList"></div>
    </aside>
  </main>
</div>
<div id="jury" class="overlay"><div class="sheet" id="jurySheet"></div></div>
<div id="toast"></div>

<script src="ductus-core.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var toast=function(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},2600);};
var qs=new URLSearchParams(location.search);

// ---- vaka tohumu: İnferior STEMI, iki varyant ----
var VARIANT = (qs.get('variant')||'').toUpperCase();
if(VARIANT!=='A'&&VARIANT!=='B') VARIANT = Math.random()<0.5?'A':'B';
var LEVEL = qs.get('level')||'student';

var SEED = {
  patientId: qs.get('pid') || 'chain1_'+Math.random().toString(36).slice(2,8),
  demographics:{ name:'E.K.', age:71, sex:'E' },
  vitals:{ hr:52, sbp:104, dbp:64, map:77, spo2:95, rr:18 },
  pathology:{ culprit:'RCA', wall:'inferior', timi:0, rvInvolvement:true, stPattern:'inferior', stented:false, noReflow:false, effusion:false, variant:VARIANT },
  simRate: 60   // 1 gerçek sn = 60 sim sn → 8-12 dk senaryo hızlanır
};

var S = DuctusCore.open({ patientId:SEED.patientId, seed:SEED, forceSeed: qs.get('resume')!=='1' });
window.ChainSession = S;

// durum: tamamlanan istasyonlar, kararlar, uyarılar
var CH = { station:'triage', done:{}, decisions:{}, flags:[], nitrateGiven:false, pocusBeforeCath:false, cathDone:false, postPciEcgDone:false, culpritCorrect:null, level:LEVEL, handoff:{} };
function logFlag(type,msg,kind){ CH.flags.push({type:type,msg:msg,kind:kind,atSimMs:S.simNow()}); }

// ---- BroadcastChannel: CathLab'dan gelen PCI sonucu ----
S.on('state', function(){ renderVitals(); });
S.on('evidence', function(){ renderEvidence(); renderVitals(); });
// CathLab chain modundan PCI sonucu geldiğinde (DeployStent zaten state'i günceller)
S.on('lifecycle', function(d){ /* ileride */ });

// =====================================================================
//  RENDER: vitaller, kanıt, istasyon durumları
// =====================================================================
function renderVitals(){
  var st=S.getState(), v=st.vitals;
  var ecgDone = S.getEvidence().some(function(e){return e.modality==='ECG12';});
  var dxTag = (ecgDone && st.pathology.wall) ? st.pathology.wall.toUpperCase()+' STEMI' : 'Akut Göğüs Ağrısı — Triyaj';
  $('pWho').innerHTML = st.demographics.name+' · '+st.demographics.age+' '+st.demographics.sex+' <small>· '+dxTag+'</small>';
  $('vHr').textContent=Math.round(v.hr); $('vBp').textContent=Math.round(v.sbp)+'/'+Math.round(v.dbp);
  $('vMap').textContent=Math.round(v.map); $('vMap').className='v'+(v.map<65?' bad':''); $('vSpo2').textContent=Math.round(v.spo2); $('vRr').textContent=Math.round(v.rr);
  $('vBp').className='v'+(v.sbp<90?' bad':'');
}
function fmtClock(ms){ var s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderEvidence(){
  var list=$('evList'); var evs=S.getEvidence(); if(!evs.length){ list.innerHTML='<div style="font-size:11px;color:var(--ink-3)">Henüz kanıt toplanmadı.</div>'; return; }
  list.innerHTML = evs.slice().reverse().map(function(e){
    var stale=S.isStale(e); var tag = !e.quality.assessable?'<span class="tag na">DEĞERLENDİRİLEMEDİ</span>':stale.stale?'<span class="tag hist">TARİHSEL</span>':'<span class="tag cur">GÜNCEL</span>';
    return '<div class="evc"><div class="top"><span class="md">'+modName(e.modality)+'</span>'+tag+'</div><div class="sm">'+e.summary+'</div><div class="tm">T+'+fmtClock(e.acquiredAtSimMs)+(stale.stale?' · '+stale.staleAreas.join(',')+' değişti':'')+'</div></div>';
  }).join('');
}
function modName(m){ return {ECG12:'12-Derivasyon EKG',angiography:'Koroner Anjiyografi',echo:'Eko / POCUS',triage:'Triyaj Değerlendirme','post-pci-ecg':'Post-PCI EKG'}[m]||m; }
function markStation(stn,txt,done){ var el=$('s-'+stn); if(el) el.textContent=txt; if(done){ CH.done[stn]=true; document.querySelector('.station[data-stn='+stn+']').classList.add('done'); } }

// =====================================================================
//  İSTASYONLAR
// =====================================================================
var STAGE={
 triage:function(){
  var st=S.getState(); var rv=st.pathology.rvInvolvement;
  return '<div class="panelttl">🚑 Acil Değerlendirme</div><div class="panelsub">Kapı anı — ilk değerlendirme, ilaç ve triyaj kararları.</div>'+
  '<div class="card"><h3>Başvuru</h3><p>71Y erkek, 40 dk önce başlayan baskı tarzı retrosternal göğüs ağrısı; bulantı ve soğuk terleme eşlik ediyor. Muayenede soluk ve terli; nabız yavaş ve düzenli, kan basıncı sınırda, akciğerler bazallerde temiz, juguler venöz dolgunluk hafif artmış. İlk değerlendirme ve stabilizasyon kararlarını verin.</p>'+
  '<div class="actions">'+
   '<button onclick="CHAIN.act(\'aspirin\')" id="a-aspirin">Aspirin 300 mg çiğnet</button>'+
   '<button onclick="CHAIN.act(\'heparin\')" id="a-heparin">Antikoagülan (heparin)</button>'+
   '<button onclick="CHAIN.act(\'nitrat\')" id="a-nitrat">Dilaltı Nitrat</button>'+
   '<button onclick="CHAIN.act(\'fluid\')" id="a-fluid">IV sıvı bolus</button>'+
  '</div>'+
  '<div id="triageFlags"></div></div>'+
  '<div class="card"><h3>Sonraki adım</h3><p>Tanıyı doğrulamak ve suçlu bölgeyi lokalize etmek için ilk basamak hangi tetkik? Reperfüzyonu geciktirme.</p>'+
   '<div class="actions"><button class="pri" onclick="CHAIN.go(\'ecg\')">12-Derivasyon EKG Çek →</button></div></div>';
 },
 ecg:function(){
  return '<div class="panelttl">💓 12-Derivasyon EKG</div><div class="panelsub">İskemik duvarı ve olası suçlu damarı tanı.</div>'+
  '<div class="card"><h3>Edinim</h3><canvas class="ecg" id="ecgCanvas" height="220"></canvas>'+
   '<div class="actions"><button class="pri" onclick="CHAIN.acquireECG()" id="a-ecg">EKG Çek & Kaydet</button>'+
   '<button onclick="CHAIN.act(\'v4r\')" id="a-v4r">Sağ prekordiyal (V4R) ekle</button></div></div>'+
  '<div class="card" id="ecgQ" style="display:none"><h3>Suçlu bölge / damar?</h3>'+
   '<div class="opts" id="culpritOpts">'+
    optRow('culprit','rca','İnferior STEMI (DII-DIII-aVF ↑) — suçlu <b>dominant RCA</b>')+
    optRow('culprit','lad','Anteriyor STEMI (V1-V4 ↑) — suçlu LAD')+
    optRow('culprit','lcx','Lateral STEMI (I-aVL-V5-V6) — suçlu Cx')+
   '</div>'+
   '<div class="actions"><button class="pri" onclick="CHAIN.submitCulprit()">Onayla</button></div><div id="ecgFlags"></div></div>';
 },
 echo:function(){
  var st=S.getState();
  return '<div class="panelttl">🫀 Eko / POCUS</div><div class="panelsub">Yatak başı ultrason — endikasyon zamanlaması önemlidir.</div>'+
  '<div class="card"><h3>POCUS</h3><div class="pocus" id="pocusView"><span style="font-size:11px;color:var(--ink-3)">POCUS çekilmedi</span></div>'+
   '<div class="actions"><button class="pri" onclick="CHAIN.acquirePOCUS()" id="a-pocus">POCUS Çek & Kaydet</button>'+
   '<button onclick="window.open(\'eko/\',\'_blank\',\'noopener\')">Tam 3D Eko modülünü aç</button></div>'+
   '<div id="echoFlags"></div></div>';
 },
 cath:function(){
  var resident = CH.level==='resident';
  var st=S.getState();
  return '<div class="panelttl">🩻 CathLab — Reperfüzyon</div><div class="panelsub">'+(resident?'Girişimsel mod: işlemi bizzat yapın.':'TUS modu: işlem ekibine devredin, sonucu değerlendirin.')+'</div>'+
  '<div class="card"><h3>Durum</h3><p>Suçlu: <b>dominant RCA</b>, '+(st.pathology.stented?'<span style="color:#8fe3bf">stentlendi — TIMI '+st.pathology.timi+(st.pathology.noReflow?' · no-reflow':'')+'</span>':'TIMI 0 oklüzyon, reperfüzyon bekliyor')+'.</p>'+
   '<div class="actions">'+
    (resident
      ? '<button class="pri" onclick="CHAIN.openCathLab()">CathLab İstasyonunu Aç (yeni sekme) →</button><button onclick="CHAIN.simCath()">Sonucu bu sekmede simüle et</button>'
      : '<button class="pri" onclick="CHAIN.simCath()">İşlem ekibine devret (primer PCI) →</button>')+
   '</div><div id="cathFlags"></div></div>'+
  '<div class="card" id="postPciCard" style="display:'+(st.pathology.stented?'block':'none')+'"><h3>İşlem sonrası yeniden değerlendirme</h3><p>Reperfüzyon sonrası yeni 12-derivasyon EKG — ST yanıtı ve ritim.</p>'+
   '<div class="actions"><button class="pri" onclick="CHAIN.postPciECG()" id="a-postecg">Post-PCI EKG Çek →</button></div><div id="postPciFlags"></div></div>';
 },
 handoff:function(){
  var evs=S.getEvidence();
  var evOpts = evs.map(function(e){ var stale=S.isStale(e); return '<label><input type="checkbox" name="ho-ev" value="'+e.id+'"><span>'+modName(e.modality)+' <span class="tm mono" style="color:var(--ink-3)">T+'+fmtClock(e.acquiredAtSimMs)+'</span> — '+e.summary+(stale.stale?' <span class="tag hist">TARİHSEL</span>':' <span class="tag cur">GÜNCEL</span>')+'</span></label>'; }).join('');
  return '<div class="panelttl">📋 Yapılandırılmış Hasta Devri (Handoff)</div><div class="panelsub">Serbest metin değil — kararlarınızı toplanan kanıtlara bağlayın.</div>'+
  '<div class="card"><h3>1) Güncel klinik durum nedir?</h3><div class="opts">'+

function drawECG(pattern){ var c=$('ecgCanvas'); if(!c) return; drawECGto(c,pattern); }
function drawECGto(c,pattern){ if(!c){ c=$('ecgCanvas'); if(!c) return; }
  var dpr=Math.min(2,window.devicePixelRatio||1); c.width=c.clientWidth*dpr; c.height=220*dpr; var x=c.getContext('2d'); x.scale(dpr,dpr);
  var W=c.clientWidth, H=220; x.fillStyle='#05080e'; x.fillRect(0,0,W,H);
  var leads=['I','II','III','aVR','aVL','aVF','V1','V2','V3','V4','V5','V6']; var cols=6, rows=2, cw=W/cols, rh=H/rows;
  var stLeads = pattern==='inferior'?{'II':1,'III':1.2,'aVF':1,'I':-0.4,'aVL':-0.5}:{};
  x.strokeStyle='rgba(95,227,154,.9)'; x.lineWidth=1.3;
  for(var i=0;i<12;i++){ var cx0=(i%cols)*cw, cy0=Math.floor(i/cols)*rh+rh*0.5; var st=stLeads[leads[i]]||0;
    x.fillStyle='rgba(159,176,198,.5)'; x.font='9px "JetBrains Mono"'; x.fillText(leads[i],cx0+4,cy0-rh*0.32);
    x.strokeStyle='rgba(95,227,154,.9)'; x.beginPath();
    for(var px=0;px<cw-6;px++){ var t=px/(cw-6); var ph=(t*2)%1; var v=qrs(ph,st); var yy=cy0-v*rh*0.3; if(px===0)x.moveTo(cx0+3+px,yy); else x.lineTo(cx0+3+px,yy); }
    x.stroke();
  }
}
function qrs(ph,st){ var g=function(c,w){return Math.exp(-((ph-c)*(ph-c))/(2*w*w));}; return 0.08*g(0.12,0.018)-0.1*g(0.19,0.006)+1.0*g(0.21,0.009)-0.22*g(0.235,0.007)+0.28*g(0.42,0.05)+st*g(0.3,0.1); }

function buildJury(){
  var st=S.getState(); var ho=CH.handoff; var evs=S.getEvidence();
  var warns=[], good=[];
  // handoff kanıt tazeliği
  var staleLinked = ho.linkedEv.filter(function(id){ var e=evs.filter(function(x){return x.id===id;})[0]; return e && S.isStale(e).stale; });
  if(staleLinked.length){ warns.push({c:'STALE_EVIDENCE_USED', m:'Güncel durum için '+staleLinked.length+' adet TARİHSEL (müdahale öncesi) kanıt bağlandı. Stent sonrası eski EKG/anjiyo güncel kanıt sayılamaz.'}); }
  else { good.push('Devirde yalnızca güncel (post-PCI) kanıt bağlandı'); }
  // durum doğruluğu
  var realStatus = st.pathology.stented ? (st.pathology.effusion||st.vitals.sbp<90?'shock':(st.pathology.noReflow?'noreflow':'reperfused')) : 'occluded';
  var statusOk = ho.status===realStatus;
  if(statusOk) good.push('Güncel klinik durum doğru beyan edildi'); else warns.push({c:'STATUS_MISMATCH', m:'Beyan edilen durum ("'+hoStatusText(ho.status)+'") gerçek duruma ("'+hoStatusText(realStatus)+'") uymuyor.'});

  // kategori puanları
  var c1=40; // Tanı & lokalizasyon
  if(CH.culpritCorrect) c1+=35; else if(CH.culpritCorrect===false) c1-=10; if(CH.decisions.ecgDone) c1+=15; if(CH.decisions.v4r) c1+=10; c1=clampN(c1);
  var c2=60; // Acil yönetim & kontrendikasyon
  if(CH.decisions.aspirin) c2+=12; if(CH.decisions.heparin) c2+=6;
  if(CH.nitrateGiven) c2-=30; else c2+=12;
  if(CH.nitrateGiven && CH.decisions.fluid) c2+=8; // kurtarma
  c2=clampN(c2);
  var c3=60; // Zamanlama & görüntüleme kararı
  if(st.pathology.variant==='B'){ var pocusDone=evs.some(function(e){return e.modality==='echo';}); if(pocusDone) c3+=25; else c3-=15; }
  else { if(CH.pocusBeforeCath) c3-=25; else c3+=20; }
  if(st.pathology.stented) c3+=10; else c3-=30; // reperfüzyon sağlandı mı
  c3=clampN(c3);
  var c4=50; // Kanıt bütünlüğü & devir
  if(!staleLinked.length) c4+=25; else c4-=30;
  if(statusOk) c4+=15; else c4-=15;
  if(CH.postPciEcgDone) c4+=10;
  if(ho.unc && ho.unc!=='none') c4+=5;
  c4=clampN(c4);
  var overall=Math.round(c1*0.25+c2*0.25+c3*0.25+c4*0.25);

  // kritik kilit
  var crit=[];
  if(!st.pathology.stented) crit.push('Reperfüzyon sağlanmadı — tıkalı suçlu damarla hasta devredildi');
  if(st.pathology.effusion && ho.trig!=='hypo' && !evs.some(function(e){return e.modality==='echo'&&!S.isStale(e).stale;})) { /* efüzyon var ama POCUS/takip tetikleyici yok */ crit.push('İşlem sonrası efüzyon/hipotansiyon tanınmadı ve takip tetikleyicisi tanımlanmadı'); }
  var locked=crit.length>0;
  var vTxt=locked?'KRİTİK — GÜVENLİ DEVİR SAĞLANMADI':(overall>=85?'MÜKEMMEL ZİNCİR YÖNETİMİ':overall<55?'YETERSİZ — GELİŞTİRİLMELİ':'KABUL EDİLEBİLİR ZİNCİR');
  var vCls=locked?'crit':(overall>=85?'ok':overall<55?'warn':'ok');

  var cat=function(nm,pc,items){ return '<div class="jcat"><div style="display:flex;justify-content:space-between"><span style="font-weight:600;font-size:12.5px">'+nm+'</span><span class="mono" style="color:var(--accent)">'+pc+'/100</span></div><ul>'+items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul></div>'; };
  $('jurySheet').innerHTML =
    '<h2>Vaka Zinciri Jürisi</h2><div class="sub">Akut göğüs ağrısından güvenli hasta devrine — karar zinciriniz ve kanıt bütünlüğünüz değerlendirildi (Varyant '+st.pathology.variant+' · '+(CH.level==='resident'?'Girişimsel':'TUS')+').</div>'+
    '<div class="scoreHead"><div><div class="bigscore">'+overall+'<small>/100</small></div><div style="font-size:10px;color:var(--ink-3)">Tanı %25 · Acil Yönetim %25 · Zamanlama&Görüntüleme %25 · Kanıt&Devir %25</div></div><div class="verdict '+vCls+'">'+vTxt+'</div></div>'+
    (locked?'<div class="jcat" style="border-color:rgba(216,95,106,.6);background:rgba(216,95,106,.08)"><div style="color:#f1b0b7;font-weight:600;margin-bottom:4px">🔒 Kritik</div><ul>'+crit.map(function(x){return '<li>⚠ '+x+'</li>';}).join('')+'</ul></div>':'')+
    (warns.length?'<div class="jcat" style="border-color:rgba(216,95,106,.5)"><div style="color:#f1b0b7;font-weight:600;margin-bottom:4px">⚠ Kanıt / Beyan Sorunları</div><ul>'+warns.map(function(w){return '<li><b>'+w.c+'</b> — '+w.m+'</li>';}).join('')+'</ul></div>':'')+
    (good.length?'<div class="jcat" style="border-color:rgba(89,184,138,.4)"><div style="color:#8fe3bf;font-weight:600;margin-bottom:4px">✓ İyi</div><ul>'+good.map(function(g){return '<li>'+g+'</li>';}).join('')+'</ul></div>':'')+
    cat('Tanı & Lokalizasyon',c1,['Suçlu damar: '+(CH.culpritCorrect?'doğru (RCA)':'yanlış/eksik'),'12-der EKG: '+(CH.decisions.ecgDone?'çekildi':'eksik')+(CH.decisions.v4r?' · V4R ile RV teyit':'')])+
    cat('Acil Yönetim & Kontrendikasyon',c2,['Aspirin: '+(CH.decisions.aspirin?'verildi':'eksik'),'Nitrat kararı: '+(CH.nitrateGiven?'⚠ RV tutulumunda nitrat verildi (hipotansiyon)':'doğru — RV\'de nitrattan kaçınıldı')])+
    cat('Zamanlama & Görüntüleme Kararı',c3,[ st.pathology.variant==='B'?('POCUS (şokta): '+(evs.some(function(e){return e.modality==='echo';})?'uygun — endikasyon doğru':'eksik — instabilitede atlanmamalı')) : ('Reperfüzyon öncesi gereksiz görüntüleme: '+(CH.pocusBeforeCath?'⚠ var (kapı-balon gecikmesi)':'yok')), 'Reperfüzyon: '+(st.pathology.stented?'sağlandı (TIMI '+st.pathology.timi+')':'⚠ sağlanmadı')])+
    cat('Kanıt Bütünlüğü & Devir',c4,['Devirde tarihsel kanıt kullanımı: '+(staleLinked.length?'⚠ '+staleLinked.length+' adet (STALE_EVIDENCE_USED)':'yok'),'Güncel durum beyanı: '+(statusOk?'doğru':'hatalı'),'Post-PCI yeniden değerlendirme: '+(CH.postPciEcgDone?'yapıldı':'eksik')])+
    '<div class="jcat"><div style="font-weight:600;margin-bottom:4px">Klinik Not</div><div style="font-size:11.5px;color:var(--ink-2);line-height:1.6">'+chainClinical(st)+'</div></div>'+
    '<div class="actions" style="margin-top:12px">'+
      '<button class="bridgebtn" style="background:rgba(95,168,216,.14);border-color:rgba(95,168,216,.45);color:#bfe0f5" onclick="window.open(\'eko/\',\'_blank\')">Eko\'da duvar hareketi</button>'+
      '<button class="bridgebtn" style="background:rgba(95,168,216,.14);border-color:rgba(95,168,216,.45);color:#bfe0f5" onclick="window.open(\'acil/\',\'_blank\')">Acil Konsol</button>'+
      '<button class="pri" onclick="restartCase()">Yeni Vaka Zinciri</button>'+
      '<button onclick="document.getElementById(\'jury\').classList.remove(\'open\')">Kapat</button></div>';
  $('jury').classList.add('open');
}
function hoStatusText(s){ return {reperfused:'reperfüze (TIMI 3)',occluded:'tıkalı/reperfüzyon yok',noreflow:'no-reflow',shock:'hipotansiyon/efüzyon'}[s]||s; }
function clampN(x){ return Math.max(0,Math.min(100,Math.round(x))); }

  if(!st.pathology.stented) return 'Reperfüzyon sağlanmadan devir yapıldı: RCA oklüzyonu sürerse inferior+RV transmural nekroz, AV blok ve kardiyojenik şok ilerler. Zaman = miyokart.';

  return 'Başarılı primer PCI (RCA TIMI 3). Reperfüzyon bradikardisi/AIVR (Bezold-Jarisch) beklenir, genelde geçici. Epikardiyal TIMI 3 ≠ doku perfüzyonu; takipte LV fonksiyonu ve blush izlenir.';
}
