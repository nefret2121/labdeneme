<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DuctusLab · Entegre Vaka Zinciri v4.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"/>
<style>
:root{--bg0:#04070e;--bg1:#070c17;--bg2:#0b1220;--bg3:#101a2c;--glass:rgba(13,20,34,.7);--line:rgba(160,176,196,.12);--line2:rgba(160,176,196,.2);
--ink:#e4e9f1;--ink2:#a6b1c2;--ink3:#6c7889;--accent:#6fa3c8;--accent2:#4f7fa3;--accentd:rgba(111,163,200,.14);
--amber:#d9a441;--amberd:rgba(217,164,65,.14);--ok:#5a9f7f;--okd:rgba(90,159,127,.16);--alert:#c4565f;--alertd:rgba(196,86,95,.16);--violet:#9a86c9;
--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:radial-gradient(1200px 800px at 70% -10%,#0a1424,var(--bg0) 60%);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:9px 18px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);flex:0 0 auto;z-index:20}
.wordmark{font-weight:700;letter-spacing:.04em;font-size:15px}.wordmark em{color:var(--accent);font-style:normal}
.vsep{width:1px;height:22px;background:var(--line2)}.product{color:var(--ink2);font-size:12.5px}.spacer{flex:1}
.chip{font-size:11.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:999px;padding:4px 11px}.chip b{color:var(--accent)}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink2);font-family:var(--sans);font-size:12px;padding:6px 11px;cursor:pointer}
.seg button.on{color:#fff;background:var(--accentd)}.seg button+button{border-left:1px solid var(--line2)}
.btn{font-family:var(--sans);font-size:12.5px;color:var(--ink2);background:rgba(17,26,43,.55);border:1px solid var(--line2);border-radius:9px;padding:7px 12px;cursor:pointer;transition:.15s}
.btn:hover{color:var(--ink);border-color:var(--accent2);background:var(--accentd)}.btn.sm{padding:5px 9px;font-size:11.5px}
/* VİTAL BARI */
.vitals{display:flex;align-items:center;gap:0;flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--bg1);padding:7px 14px;overflow-x:auto}
.vitals .vt{display:flex;flex-direction:column;align-items:flex-start;padding:2px 16px;border-right:1px solid var(--line)}
.vitals .vt:last-child{border-right:0}
.vitals .vl{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.vitals .vv{font-family:var(--mono);font-size:16px;font-weight:600;line-height:1.1}
.vitals .vv.crit{color:#e88b92}.vitals .vv.warn{color:var(--amber)}.vitals .vv.ok{color:#8fe3bf}
.vitals .vphase{margin-left:auto;font-size:10.5px;color:var(--violet);white-space:nowrap}
.main{flex:1;display:flex;min-height:0}
.rail{flex:0 0 232px;border-right:1px solid var(--line);background:var(--bg1);overflow-y:auto;padding:12px 10px}
.rail h4{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:4px 6px 9px}
.station{display:flex;gap:9px;align-items:flex-start;padding:9px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;background:var(--bg2);transition:.15s}
.station:hover{border-color:var(--accent2)}.station.cur{border-color:var(--accent);background:var(--accentd)}
.station.done{opacity:.72}.station.done .ic{color:var(--ok)}
.station .ic{font-size:12px;font-weight:700;color:var(--ink3);min-width:42px;font-family:var(--mono)}
.station .nm{font-size:12.5px;font-weight:600}.station .st{font-size:10.5px;color:var(--ink3);margin-top:2px}
.phasebar{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--violet);margin:11px 6px 6px;border-top:1px solid var(--line);padding-top:9px}
.content{flex:1;min-width:0;overflow-y:auto;padding:18px 20px}
.panel{max-width:720px}
.panelttl{font-size:18px;font-weight:700;margin-bottom:3px}
.panelsub{color:var(--ink2);font-size:12.5px;margin-bottom:13px;line-height:1.5}
.card{border:1px solid var(--line);border-radius:12px;background:var(--glass);padding:14px 15px;margin-bottom:13px}
.card h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:9px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:3px}
.actions button{font-family:var(--sans);font-size:12.5px;color:var(--ink);background:var(--bg3);border:1px solid var(--line2);border-radius:9px;padding:9px 12px;cursor:pointer;transition:.15s}
.actions button:hover{border-color:var(--accent2);background:var(--accentd)}
.actions button.pri{background:linear-gradient(135deg,#7ec0e8,#5a9bc4);color:#06131d;font-weight:600;border:0}
.actions button.done{opacity:.55}.actions button.trap{border-color:rgba(196,86,95,.3)}
.finding{margin-top:10px;border:1px solid rgba(90,159,127,.4);background:var(--okd);border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.finding b{color:#8fe3bf}
.drawer{margin-top:10px;border:1px solid var(--line2);border-radius:11px;overflow:hidden;display:none;background:#05080f}
.drawer.open{display:block}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--bg2);font-size:11.5px;color:var(--ink2)}
.drawer iframe{width:100%;height:440px;border:0;display:block;background:#05080f}
.flag{font-size:12px;padding:8px 11px;border-radius:9px;margin-top:8px;border:1px solid;line-height:1.45}
.flag.red{color:#e88b92;border-color:rgba(196,86,95,.45);background:var(--alertd)}
.flag.amber{color:var(--amber);border-color:rgba(217,164,65,.45);background:var(--amberd)}
.flag.green{color:#8fe3bf;border-color:rgba(90,159,127,.45);background:var(--okd)}
.hint{font-size:11.5px;color:var(--ink3);margin-top:7px;line-height:1.5}
/* SAĞ KANIT ÇİZELGESİ */
.evrail{flex:0 0 288px;border-left:1px solid var(--line);background:var(--bg1);overflow-y:auto;padding:14px 12px}
.evrail h4{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:2px 4px 10px;display:flex;justify-content:space-between}
.evitem{border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:9px;background:var(--bg2);padding:9px 10px;margin-bottom:8px}
.evitem.stale{border-left-color:var(--amber);opacity:.86}
.evitem .et{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--ink3)}
.evitem .es{font-size:12px;margin-top:4px;line-height:1.45}
.evitem .etag{font-size:9.5px;padding:2px 7px;border-radius:999px;border:1px solid}
.etag.fresh{color:#8fe3bf;border-color:rgba(90,159,127,.4);background:var(--okd)}
.etag.stale{color:var(--amber);border-color:rgba(217,164,65,.45);background:var(--amberd)}
.ho-q{margin:10px 0}.ho-q .q{font-size:13px;font-weight:600;margin-bottom:7px}
.ho-q label{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink2);padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer;line-height:1.4}
.ho-q label:hover{border-color:var(--accent2)}.ho-q label.sel{border-color:var(--accent);background:var(--accentd);color:var(--ink)}
.ho-q input{margin-top:2px;accent-color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(2,5,10,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60;padding:22px}
.overlay.open{display:flex}
.sheet{width:min(720px,94vw);max-height:90vh;overflow-y:auto;background:var(--bg1);border:1px solid var(--line2);border-radius:16px;padding:22px 24px}
.sheet h2{font-size:20px;margin-bottom:5px}.sheet .sub{color:var(--ink2);font-size:12.5px;margin-bottom:14px}
.jcat{margin:9px 0;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg2)}
.jcat .r{display:flex;justify-content:space-between;font-weight:600;font-size:13px}.bar{height:6px;border-radius:4px;background:#17202f;margin-top:7px;overflow:hidden}.bar>span{display:block;height:100%}
#selLvl button.on,#selVar button.on,#selTrack button.on{background:linear-gradient(135deg,#49a6e6,#36bd8e);color:#05121c;font-weight:700;box-shadow:0 0 0 1px rgba(90,200,150,.35) inset}
#selLvl button.on::after,#selVar button.on::after,#selTrack button.on::after{content:' ✓';font-weight:800}
#selStatus{margin:10px 0 2px;padding:9px 12px;border:1px solid rgba(90,200,150,.3);background:rgba(54,189,142,.08);border-radius:9px;font-size:12px;color:#bfe9d6;line-height:1.45}
.selgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.selcard{border:1px solid var(--line);border-radius:13px;background:var(--bg2);padding:14px;cursor:pointer;transition:.15s}
.selcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.selcard.dus{border-color:rgba(90,159,127,.35)}.selcard.dus .cx{color:#8fe3bf}.selcard .cx{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.06em}
.selcard .ct{font-size:15px;font-weight:700;margin:4px 0 4px}.selcard .cc{font-size:11.5px;color:var(--ink3);line-height:1.5}.selcard .cm{margin-top:8px;font-size:10px;color:var(--ink3)}
.toast{position:fixed;left:24px;bottom:22px;background:rgba(10,16,28,.96);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:9px;padding:11px 15px;font-size:12.5px;max-width:420px;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.bad{border-left-color:var(--alert)}.toast.warn{border-left-color:var(--amber)}.toast.good{border-left-color:var(--ok)}
@media(max-width:1100px){.evrail{flex-basis:220px}.rail{flex-basis:190px}}
@media(max-width:860px){.selgrid{grid-template-columns:1fr}.evrail{display:none}}

/* ===== MOBİL (≤900px): sticky vital şeridi → yatay istasyon hapları → tam genişlik karar kartı → alt sekmeler; gömülü modül tam ekran ===== */
#ccTabs{display:none}
.d-only{display:inline}.m-only{display:none}
@media(max-width:900px){
 html,body{height:100%;overflow:hidden;max-width:100vw}
 .app{height:100dvh;min-height:-webkit-fill-available;padding-bottom:calc(56px + env(safe-area-inset-bottom));box-sizing:border-box}
 .topbar{gap:6px;padding:max(6px,env(safe-area-inset-top)) 8px 6px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;backdrop-filter:none}
 .topbar::-webkit-scrollbar{display:none}.topbar>*{flex:0 0 auto}
 .topbar .product,.topbar .vsep,.topbar .spacer{display:none}
 .topbar .wordmark{font-size:14px}
 #chainTitle{display:inline !important;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
 .topbar .btn,.topbar .seg button{min-height:44px}
 .vitals{display:grid !important;grid-template-columns:repeat(4,1fr);padding:3px 6px;row-gap:0;overflow:visible;position:sticky;top:0;z-index:15}
 .vitals .vt{padding:2px 6px;border-right:0;border-bottom:0;min-width:0}
 .vitals .vv{font-size:15px}.vitals .vphase{display:none}
 .main{flex-direction:column;min-height:0;flex:1 1 0}
 .rail{flex:0 0 auto;display:flex;flex-direction:row;gap:6px;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:7px 8px;scrollbar-width:none;counter-reset:stn;-webkit-overflow-scrolling:touch}
 .rail::-webkit-scrollbar{display:none}
 .rail h4,.rail .phasebar{display:none}
 .station{flex:0 0 auto;margin:0;min-height:44px;align-items:center;padding:6px 11px;border-radius:22px;counter-increment:stn;gap:7px;max-width:70vw}
 .station .ic{min-width:0;font-size:11px}
 .station .nm{font-size:12px;white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
 .station .nm::before{content:'İstasyon ' counter(stn) ' · ';color:var(--ink3);font-weight:500}
 .station .st{display:none}
 .content{padding:12px 12px 14px;flex:1 1 0;min-height:0;-webkit-overflow-scrolling:touch;touch-action:pan-y}
 .panel{max-width:none}
 .panelttl{font-size:16px}
 .actions button,.actions .btn,.card button{min-height:48px;font-size:14px}
 .actions{gap:8px}.actions>button{flex:1 1 100%}
 .evrail{display:none;position:fixed;left:0;right:0;top:0;bottom:calc(56px + env(safe-area-inset-bottom));z-index:55;flex:none;width:auto;border-left:0;background:var(--bg1);padding:max(14px,env(safe-area-inset-top)) 14px 16px;overflow-y:auto}
 body.cc-evopen .evrail{display:block}
 #ccTabs{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:70;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(7,12,22,.97);border-top:1px solid var(--line2)}
 #ccTabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:#8f9db0;font:600 11px system-ui,sans-serif;min-height:54px;position:relative}
 #ccTabs button .ic{font-size:19px}#ccTabs button.on{color:#fff}
 #ccTabs button.on::before{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
 #ccTabs .bdg{position:absolute;top:4px;left:55%;min-width:17px;height:17px;border-radius:9px;background:var(--accent2,#36bd8e);color:#04121a;font-size:10.5px;display:none;align-items:center;justify-content:center;padding:0 4px}
 #ccTabs .bdg.show{display:flex}
 /* seçici + jüri tam ekran */
 .overlay{padding:0;align-items:stretch}
 .sheet{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;border:0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));box-sizing:border-box}
 .sheet h2{font-size:17px}
 .selgrid{grid-template-columns:1fr;gap:10px}
 .selcard{padding:13px}
 #selTrack{display:grid;grid-template-columns:1fr 1fr;width:100%}
 #selTrack button{white-space:normal;line-height:1.25;min-height:46px;padding:6px 8px;font-size:12.5px}
 #selTrack button:first-child{grid-column:1/-1}
 #selLvl,#selVar{width:100%;display:flex}#selLvl button,#selVar button{flex:1;min-height:44px}
 .sheet .btn,.sheet button{min-height:44px}
 .sheet.dm-sheetbar::before{content:none}
 .toast{left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));max-width:none}
 /* gömülü simülatör: tam ekran modal */
 .d-only{display:none}.m-only{display:inline}
 .drawer.open{display:flex;flex-direction:column;position:fixed;inset:0;width:100vw;height:100dvh;margin:0;border:0;border-radius:0;z-index:80;background:#05080f}
 .drawer.open .dh{flex:0 0 auto;padding:max(8px,env(safe-area-inset-top)) 8px 8px;min-height:52px;position:sticky;top:0}
 .drawer.open .dh>span{display:none}
 .drawer.open .dh .btn{width:100%;min-height:44px;font-size:14px;font-weight:700;background:linear-gradient(135deg,#49a6e6,#36bd8e);color:#05121c;border:0}
 .drawer.open>div:last-child{flex:1 1 0;min-height:0;display:flex}
 .drawer.open iframe{width:100%;height:100%;flex:1}
 body.cc-embed #ccTabs{display:none}
}
</style>

<body>
<div class="app">
  <div class="topbar">
    <span class="wordmark">Ductus<em>Lab</em></span><span class="vsep"></span>
    <span class="product" id="chainTitle">Entegre Nöbet &amp; Vaka Zinciri</span>
    <span class="spacer"></span>
    <span class="chip" id="varChip" style="display:none">Varyant <b id="varB">A</b></span>
    <span class="chip mono">⏱ <span id="simClock">00:00</span></span>
    <div class="seg" id="lvlSeg"><button class="on" data-lvl="student">TUS / Öğrenci</button><button data-lvl="resident">Asistan / Girişimsel</button></div>
    <button class="btn sm" id="switchBtn">⇄ Zincir Değiştir</button>
    <button class="btn sm" id="homeBtn">← Anasayfa</button>
  </div>
  <div class="vitals" id="vitalsBar" style="display:none"></div>
  <div class="main">
    <div class="rail" id="rail"></div>
    <div class="content"><div class="panel" id="panel"></div></div>
    <div class="evrail" id="evrail"></div>
  </div>
</div>
<div id="selOverlay" class="overlay open"><div class="sheet" id="selSheet"></div></div>
<div id="jury" class="overlay"><div class="sheet" id="jurySheet"></div></div>
<nav id="ccTabs"><button id="ccT-st" class="on" type="button"><span class="ic">🩺</span>İstasyon</button><button id="ccT-ev" type="button"><span class="ic">📎</span>Toplanan Kanıtlar<span class="bdg" id="ccBdg"></span></button><button id="ccT-sw" type="button"><span class="ic">⇄</span>Zincirler</button></nav>
<div id="toastHost"></div>

<script src="ductus-core.js"></script>
<script>
/* ===================================================================================
 *  DuctusLab · Case Chain v4.0 — 11 entegre hasta zinciri (7 TUS + 4 DUS), 21 modül, ductus-core v1.3
 *  Canlı vital barı · zaman damgalı kanıt çizelgesi (GÜNCEL/TARİHSEL) · gömülü iframe
 *  çekmece + gerçek ?chain preset senkronu · meta-spoiler'sız klinik handoff.
 * =================================================================================== */
var $=function(id){return document.getElementById(id);};

var HREF={ ACİL:'acil/index.html', EKG:'ekg/index.html', EKO:'eko/index.html', VNT:'ventilator/index.html',
  KS:'ks/index.html', OTO:'oto/index.html', SFT:'sft/index.html', FND:'fnd/index.html', NRO:'nro/index.html',
  CathLab:'ductuslab-cathlab.html', 'NŞR':'ductuslab-neurosurgery.html', OSK:null, POCUS:'eko/index.html',
  HVY:'ductuslab-airway.html', 'USG-Access':'ductuslab-usg-access.html', LapChole:'ductuslab-lapchole.html',
  ENDO:'ductuslab-endo.html', OMFS:'ductuslab-omfs.html', 'PERİO':'ductuslab-perio.html', VPT:'ductuslab-vpt.html', FRM:'ductuslab-pharma.html' };
var MODNAME={ ACİL:'Acil Konsol', EKG:'12-Derivasyon EKG', EKO:'Eko / POCUS', VNT:'Ventilatör', KS:'Kraniyal Sinir',
  OTO:'Otoskopi', SFT:'Spirometri', FND:'Fundoskopi', NRO:'Nörolojik Muayene', CathLab:'Kateter Lab', 'NŞR':'Nöroşirürji', OSK:'Oskültasyon', POCUS:'POCUS',
  HVY:'Hava Yolu (RSI)', 'USG-Access':'USG Girişim (POCUS)', LapChole:'Laparoskopik Kolesistektomi',
  ENDO:'Endodonti (ENDO)', OMFS:'Ağız-Çene Cerrahisi (OMFS)', 'PERİO':'Periodontoloji (PERİO)', VPT:'Vital Pulpa Tedavisi (VPT)', FRM:'Farmakoloji (FRM)',
  /* kanıt modaliteleri (v1.3 dental) */ PA:'Periapikal Rö (PA)', PAN:'Panoramik Rö', CBCT:'CBCT', EAL:'Apeks Bulucu (EAL)', aspiration:'Aspirasyon Testi', perio_probe:'Periodontal Sondlama', lab:'Laboratuvar / Anamnez', clinical_dental:'Dental Klinik Muayene', capnography:'Kapnografi', ECG12:'12-Derivasyon EKG' };
var EXAMVERB={ ACİL:'🩸 Değerlendirme Sonucunu Gör', EKG:'⚡ 12-Der EKG Çek & Bulguyu Gör', EKO:'🫀 POCUS Bulgusunu İncele', VNT:'🌬 Ventilatör Yanıtını Gör',
  KS:'👁 Kraniyal Sinir Bulgusunu Gör', OTO:'👂 Otoskopi Bulgusunu Gör', SFT:'🫁 Spirometri Sonucunu Gör', FND:'🔎 Fundoskopi Bulgusunu İncele',
  NRO:'🚶 Nörolojik Muayene Bulgusunu Gör', CathLab:'🩺 Anjiyo/PCI Sonucunu Gör', 'NŞR':'🧠 Operasyon Sonucunu Gör', OSK:'🎧 Oskültasyon Bulgusunu Gör', POCUS:'🫀 POCUS Bulgusunu İncele',
  HVY:'🌬 Entübasyon Sonucunu Gör', 'USG-Access':'🪡 Girişim Sonucunu Gör', LapChole:'🔪 Cerrahi Sonucunu Gör',

/* =============================== DURUM / MOTOR =============================== */
function complaintOf(ch,v){ return (ch.complaintByVariant&&ch.complaintByVariant[v])||ch.complaint; }
var CC={ track:'all', chainId:null, chain:null, variant:'A', level:'student', idx:0, done:{}, flags:[], handoff:{}, S:null, booted:false, vitals:null, capturedEv:{} };

function openSession(){ CC.S=DuctusCore.open({ patientId:'chain'+CC.chainId+'-'+CC.variant+'-'+Date.now(), forceSeed:true,
    seed:{ revisions:{coronary:0,rhythm:0,hemodynamic:0,respiratory:0,neuro:0}, truth:{dx:CC.chain.dxTitle, dental:CC.chain.truthDental||undefined}, dental:CC.chain.dental||undefined } }); }

function boot(chainId,variant,level){ CC.chainId=chainId; CC.chain=CHAINS[chainId]; CC.variant=variant||'A'; CC.level=level||CC.level;
  CC.idx=0; CC.done={}; CC.flags=[]; CC.handoff={}; CC.capturedEv={}; CC.booted=true; CC.vitals=Object.assign({},CC.chain.vitals); openSession();
  $('selOverlay').classList.remove('open'); $('jury').classList.remove('open');
  $('chainTitle').textContent='Zincir #'+chainId+(CC.chain.code?' ('+CC.chain.code+')':'')+' · '+CC.chain.nick+'  ·  '+CC.chain.path;
  $('varChip').style.display=''; $('varB').textContent=CC.variant; $('vitalsBar').style.display='flex';
  [].forEach.call($('lvlSeg').children,function(b){ b.classList.toggle('on',b.dataset.lvl===CC.level); });
  renderVitalsBar(); renderRail(); renderStation(0); renderEvRail();
  toast('Zincir #'+chainId+' başladı — canlı vitaller üstte, toplanan kanıt sağda. Tanı öncesi spoiler yok.','good');
}
// v3.0 — varyant kapılı istasyon görünürlüğü (vonly yoksa her varyantta görünür)
function stVisible(st){ return !st.vonly || st.vonly===CC.variant; }
function visibleIdx(){ return CC.chain.stations.map(function(st,i){return stVisible(st)?i:-1;}).filter(function(i){return i>=0;}); }
function allStationsDone(){ return visibleIdx().every(function(i){ return CC.done[i]; }); }
function isStaleEv(ev){ try{ return CC.S.isStale(ev); }catch(e){ return {stale:false,staleAreas:[]}; } }

/* -------- CANLI VİTAL BARI -------- */
function applyVitals(vfx){ if(!vfx||!CC.vitals)return; Object.keys(vfx).forEach(function(k){ if(CC.vitals[k]!=null) CC.vitals[k]=CC.vitals[k]+vfx[k]; });
  CC.vitals.sbp=Math.max(40,CC.vitals.sbp); CC.vitals.dbp=Math.max(20,Math.min(CC.vitals.dbp,CC.vitals.sbp-10));
  CC.vitals.spo2=Math.max(60,Math.min(100,CC.vitals.spo2)); CC.vitals.hr=Math.max(28,CC.vitals.hr); CC.vitals.gcs=Math.max(3,Math.min(15,CC.vitals.gcs)); renderVitalsBar(); }
function renderVitalsBar(){ var v=CC.vitals; if(!v){return;} var bar=$('vitalsBar');
  function cls(name){ if(name==='map'){ var m=MAP(v); return m<60?'crit':m<70?'warn':'ok'; }
    if(name==='spo2'){ return v.spo2<85?'crit':v.spo2<90?'warn':'ok'; } if(name==='hr'){ return (v.hr<45||v.hr>120)?'crit':(v.hr<50||v.hr>100)?'warn':'ok'; }
    if(name==='sbp'){ return (v.sbp<90||v.sbp>200)?'crit':(v.sbp<100||v.sbp>180)?'warn':'ok'; } if(name==='rr'){ return (v.rr>28||v.rr<8)?'crit':v.rr>24?'warn':'ok'; }
    if(name==='gcs'){ return v.gcs<9?'crit':v.gcs<14?'warn':'ok'; } return 'ok'; }
  var phase=''; var cur=(typeof CC.idx==='number')?CC.chain.stations[CC.idx]:null; if(cur&&cur.phase) phase='Faz '+cur.phase;
  var h='<div class="vt"><span class="vl">HR</span><span class="vv '+cls('hr')+'">'+v.hr+' <span style="font-size:10px;color:var(--ink3)">/dk</span></span></div>'+
    '<div class="vt"><span class="vl">KB</span><span class="vv '+cls('sbp')+'">'+v.sbp+'/'+v.dbp+'</span></div>'+
    '<div class="vt"><span class="vl">MAP</span><span class="vv '+cls('map')+'">'+MAP(v)+'</span></div>'+
    '<div class="vt"><span class="vl">SpO₂</span><span class="vv '+cls('spo2')+'">%'+v.spo2+'</span></div>'+
    '<div class="vt"><span class="vl">RR</span><span class="vv '+cls('rr')+'">'+v.rr+'</span></div>'+
    '<div class="vt"><span class="vl">Bilinç/GCS</span><span class="vv '+cls('gcs')+'">'+v.gcs+'</span></div>'+
    (v.paco2!=null?'<div class="vt"><span class="vl">PaCO₂</span><span class="vv '+(v.paco2>60?'warn':'ok')+'">'+v.paco2+'</span></div>':'')+
    '<div class="vphase">'+(phase?phase+' · ':'')+'Zincir #'+CC.chainId+' · Varyant '+CC.variant+'</div>';
  bar.innerHTML=h;
}

/* -------- İSTASYON ZİNCİRİ (SOL) -------- */
function renderRail(){ var r=$('rail'), h='<h4>İstasyon Zinciri</h4>'; var lastPhase=null;
  CC.chain.stations.forEach(function(st,i){ if(!stVisible(st))return;   // varyant dışı istasyon gizli
    if(st.phase&&st.phase!==lastPhase){ h+='<div class="phasebar">Faz '+st.phase+'</div>'; lastPhase=st.phase; }
    var cls='station'+(i===CC.idx?' cur':'')+(CC.done[i]?' done':'');
    h+='<div class="'+cls+'" data-i="'+i+'"><div class="ic">'+st.mod+'</div><div><div class="nm">'+st.title+'</div><div class="st">'+(CC.done[i]?'tamamlandı':MODNAME[st.mod]||st.mod)+'</div></div></div>'; });
  h+='<div class="phasebar">Kapanış</div><div class="station'+(CC.idx==='handoff'?' cur':'')+'" data-i="handoff"><div class="ic">📋</div><div><div class="nm">Hasta Devri</div><div class="st">4 yapılandırılmış soru + jüri</div></div></div>';
  r.innerHTML=h;
  [].forEach.call(r.querySelectorAll('.station'),function(el){ el.onclick=function(){ var i=el.dataset.i; if(i==='handoff'){ if(allStationsDone()) renderHandoff(); else toast('Önce istasyonları tamamlayın.','warn'); } else renderStation(+i); }; });
}

/* -------- İSTASYON PANELİ (ORTA) -------- */
function moduleURL(st,i){ var href=HREF[st.mod]; if(!href)return null;
  var u=href+(href.indexOf('?')<0?'?':'&')+'chain=1&chainId='+CC.chainId+'&station='+st.mod+'&variant='+CC.variant+'&pid='+encodeURIComponent(CC.S.getState().patientId);
  if(st.caseN) u+='&case='+st.caseN; return u; }
function renderStation(i){ CC.idx=i; renderRail(); renderVitalsBar(); var st=CC.chain.stations[i], p=$('panel'), url=moduleURL(st,i);
  var h='<div class="panelttl">'+st.title+'</div><div class="panelsub"><b>Başvuru:</b> '+complaintOf(CC.chain,CC.variant)+'<br>'+st.prompt+'</div>';
  h+='<div class="card"><h3>'+(MODNAME[st.mod]||st.mod)+' İstasyonu</h3><div class="actions">';
  if(st.ev) h+='<button class="pri" id="cap-'+i+'" onclick="examCapture('+i+')">'+(EXAMVERB[st.mod]||'🔎 Bulguyu İncele & Kaydet')+'</button>';
  if(url){ h+='<button onclick="toggleDrawer('+i+')">🔬 Simülatörü İstasyon İçinde Aç (Gömülü)</button>';
    h+='<button onclick="openNewTab('+i+')">↗ Yeni Sekmede Aç</button>'; }
  h+='</div>';
  h+='<div id="finding-'+i+'"></div>';
  if(url) h+='<div class="drawer" id="drawer-'+i+'"><div class="dh"><span>↳ '+MODNAME[st.mod]+' — bu hastanın vakası (?chain=1) ile gömülü</span><button class="btn sm" onclick="closeEmbed('+i+')"><span class="d-only">Kapat</span><span class="m-only">← Zincire Dön &amp; Kanıtı Kaydet</span></button></div><div id="iframewrap-'+i+'"></div></div>';
  h+='</div>';
  if(st.decisions&&st.decisions.length){ h+='<div class="card"><h3>Klinik Karar</h3><div class="actions" id="dec-'+i+'">';
    st.decisions.forEach(function(dec){ h+='<button class="'+(dec.kind==='trap'?'trap ':'')+'" id="d-'+i+'-'+dec.id+'" onclick="decide('+i+',\''+dec.id+'\')">'+dec.label+'</button>'; });
    h+='</div><div id="decflags-'+i+'"></div></div>'; }
  h+='<div class="actions"><button class="pri" onclick="nextStation('+i+')">Bu istasyonu tamamla →</button></div>';
  p.innerHTML=h; renderFinding(i); renderDecFlags(i);
}
function renderFinding(i){ var box=$('finding-'+i); if(!box)return; var st=CC.chain.stations[i];
  if(CC.done['ev'+i]&&st.ev){ var ev=CC.capturedEv[i], stale=ev?isStaleEv(ev).stale:false;
    box.innerHTML='<div class="finding"><b>Bulgu kaydedildi'+(stale?' (TARİHSEL)':'')+':</b> '+st.ev.sum+'</div>'; }
  else if(st.ev) box.innerHTML='<div class="hint">Bu istasyonun bulgusu henüz incelenmedi — kanıt kaydetmeden devam etmeyin.</div>';
}
function renderDecFlags(i){ var box=$('decflags-'+i); if(!box)return; var mine=CC.flags.filter(function(f){return f.station===i;});
